<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" type="image/png" href="/assets/byup-icon.png"/>
<link rel="apple-touch-icon" href="/assets/byup-icon.png"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>byup Staff — App cameriere</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F5F6F8;  /* PN.BG — stesso canvas del gestionale */
    color: #0F1115;
  }
  /* L'app riempie la finestra del browser e si adatta fino a mini iPad. */
  #root { width: 100%; height: 100%; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>
<body>
<a id="byup-hub-btn" href="/" aria-label="Torna alla home byup">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
  <span>Home byup</span>
</a>
<style>
#byup-hub-btn{position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:9px 14px 9px 11px;font:600 13px/1 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:#fff;text-decoration:none;background:rgba(20,20,24,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);transition:transform .18s ease,background .18s ease}
#byup-hub-btn:hover{background:rgba(20,20,24,.92);transform:translateY(-2px)}
#byup-hub-btn svg{flex:none}
@media print{#byup-hub-btn{display:none}}
</style>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- PN = design tokens del gestionale. DEVE stare prima di staff-tokens.jsx:
       il cameriere eredita da qui brand, neutri, stati e materiali. -->
  <script type="text/babel" src="../gestionale/panoramica-tokens.jsx"></script>
  <script type="text/babel" src="staff-tokens.jsx"></script>
  <script type="text/babel" src="staff-data.jsx"></script>
  <script type="text/babel" src="staff-screen-sala.jsx"></script>
  <script type="text/babel" src="staff-screen-tavolo.jsx"></script>
  <script type="text/babel" src="staff-screen-menu.jsx"></script>
  <script type="text/babel" src="staff-screen-ordini.jsx"></script>
  <script type="text/babel" src="staff-screen-pagamento.jsx"></script>
  <script type="text/babel" src="staff-modali.jsx"></script>

  <script type="text/babel" src="staff-app.jsx"></script>

  <script type="text/babel">
    // Distingue un dispositivo touch reale (telefono / mini iPad) da un
    // browser desktop, in base al tipo di puntatore — non alla larghezza.
    // Così su desktop il selettore resta sempre visibile anche restringendo
    // la finestra, mentre sul telefono vero l'app va a tutto schermo.
    function isRealMobileDevice() {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      return coarse && (navigator.maxTouchPoints || 0) > 0;
    }

    // Dimensioni cornice mostrate da desktop.
    const DEVICES = [
      { id: 'phoneS',  label: 'Telefono S',     w: 360,  h: 740 },
      { id: 'se',      label: 'iPhone SE',      w: 375,  h: 667 },
      { id: 'phone',   label: 'Telefono',       w: 390,  h: 844 },
      { id: 'phoneL',  label: 'Telefono grande', w: 430, h: 932 },
      { id: 'ipad',    label: 'Mini iPad',      w: 768,  h: 1024 },
      { id: 'ipadL',   label: 'Mini iPad orizz.', w: 1024, h: 768 },
    ];

    // Su desktop l'app NON è pensata per essere usata a tutto schermo: la
    // mostriamo dentro una cornice da telefono, con un selettore di dimensione
    // sempre visibile. Il layout va a capo (wrap) quando la finestra è stretta,
    // così i pulsanti restano sempre raggiungibili.
    function DesktopFramePreview() {
      const [devId, setDevId] = React.useState('phone');
      const dev = DEVICES.find(d => d.id === devId) || DEVICES[0];
      return (
        <div style={{
          width: '100%', height: '100%', background: '#1a1a1f',
          display: 'flex', flexWrap: 'wrap', alignItems: 'flex-start', justifyContent: 'center',
          gap: 40, padding: '40px 24px', overflow: 'auto',
          fontFamily: "'Plus Jakarta Sans', sans-serif",
        }}>
          {/* pannello informativo */}
          <div style={{ maxWidth: 320, paddingTop: 24, flexShrink: 0 }}>
            <div style={{
              width: 56, height: 56, borderRadius: 16, marginBottom: 20,
              background: '#FFE0DD', display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF5A5F" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="2" width="12" height="20" rx="3"/>
                <line x1="11" y1="18" x2="13" y2="18"/>
              </svg>
            </div>
            <div style={{ fontSize: 22, fontWeight: 800, color: '#fff', marginBottom: 12, letterSpacing: -0.4 }}>
              Pensata per il telefono
            </div>
            <div style={{ fontSize: 14.5, lineHeight: 1.55, color: 'rgba(255,255,255,0.6)', fontWeight: 500, marginBottom: 24 }}>
              La funzionalità cameriere è pensata per schermi di dimensione massima di un mini iPad.
              Accedi da un dispositivo mobile o mini iPad per operare correttamente.
              Qui vedi l'anteprima di come appare.
            </div>
            {/* selettore dimensione */}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {DEVICES.map(d => {
                const on = d.id === devId;
                return (
                  <button key={d.id} onClick={() => setDevId(d.id)} style={{
                    padding: '8px 14px', borderRadius: 999, cursor: 'pointer',
                    border: '1px solid ' + (on ? 'transparent' : 'rgba(255,255,255,0.25)'),
                    background: on ? '#fff' : 'transparent',
                    color: on ? '#0F1115' : 'rgba(255,255,255,0.8)',
                    fontFamily: 'inherit', fontSize: 12.5, fontWeight: 700,
                  }}>{d.label}</button>
                );
              })}
            </div>
          </div>
          {/* cornice device con l'app dentro */}
          <div style={{
            width: dev.w, height: dev.h, flexShrink: 0,
            borderRadius: 44, overflow: 'hidden', background: '#F5F6F8',
            boxShadow: '0 30px 70px rgba(0,0,0,0.45), 0 0 0 11px #111, 0 0 0 12px rgba(255,255,255,0.08)',
          }}>
            <StaffApp/>
          </div>
        </div>
      );
    }

    function Mount() {
      // Telefono / mini iPad reale (touch) → app a tutto schermo.
      if (isRealMobileDevice()) {
        return (
          <div style={{ width: '100%', height: '100%', fontFamily: "'Plus Jakarta Sans', sans-serif", overflow: 'hidden' }}>
            <StaffApp/>
          </div>
        );
      }
      // Desktop → cornice telefono con l'app dentro e selettore sempre visibile.
      return <DesktopFramePreview/>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Mount/>);
  </script>
</body>
</html>
