<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" type="image/png" href="/assets/byup-icon.png?v=2"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-byup.png?v=2"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Byup Staff — Incassa con Stripe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a1f;
    color: #0F1115;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  #stage {
    display: flex; gap: 28px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center; max-width: 1400px;
  }
  .meta {
    color: rgba(255,255,255,0.55); font-size: 11px;
    letter-spacing: 0.4px; text-transform: uppercase;
    text-align: center; margin-top: 12px; font-weight: 600;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>
<body>
<a id="byup-hub-btn" href="/" aria-label="Torna alla home byup">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
  <span>Home byup</span>
</a>
<style>
#byup-hub-btn{position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:9px 14px 9px 11px;font:600 13px/1 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:#fff;text-decoration:none;background:rgba(20,20,24,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);transition:transform .18s ease,background .18s ease}
#byup-hub-btn:hover{background:rgba(20,20,24,.92);transform:translateY(-2px)}
#byup-hub-btn svg{flex:none}
@media print{#byup-hub-btn{display:none}}
</style>

  <div id="stage">
    <div>
      <div id="phone-frame"></div>
      <div class="meta">Byup Staff · v1.0 · Pagamenti Stripe</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx?v=32"></script>

  <!-- Il POS si usa col dito su un telefono, mai col mouse: niente feedback di
       hover, solo pressione. Va dichiarato PRIMA di panoramica-tokens.jsx, che
       al caricamento decide quale foglio di feedback iniettare. Stessa scelta
       del cameriere: le due app staff vanno tenute gemelle. -->
  <script>window.__BYUP_TOUCH_SURFACE = true;</script>

  <!-- PN = design tokens del gestionale. DEVE stare prima di pos-tokens.jsx:
       il POS eredita da qui brand, neutri e materiali. -->
  <script type="text/babel" src="../gestionale/panoramica-tokens.jsx?v=32"></script>
  <script type="text/babel" src="pos-tokens.jsx?v=32"></script>
  <script type="text/babel" src="pos-data.jsx?v=32"></script>
  <script type="text/babel" src="pos-screen-login.jsx?v=32"></script>
  <script type="text/babel" src="pos-screen-incassa.jsx?v=32"></script>
  <script type="text/babel" src="pos-screen-pagamento.jsx?v=32"></script>
  <script type="text/babel" src="pos-screen-transazioni.jsx?v=32"></script>
  <script type="text/babel" src="pos-screen-profilo.jsx?v=32"></script>
  <script type="text/babel" src="pos-modali.jsx?v=32"></script>

  <script type="text/babel" src="pos-app.jsx?v=32"></script>

  <script type="text/babel">
    function Mount() {
      return (
        <IOSDevice>
          <div style={{ position:'relative', width:'100%', height:'100%', fontFamily:"'Plus Jakarta Sans', sans-serif", overflow:'hidden' }}>
            <POSApp/>
          </div>
        </IOSDevice>
      );
    }
    ReactDOM.createRoot(document.getElementById('phone-frame')).render(<Mount/>);
  </script>
</body>
</html>
