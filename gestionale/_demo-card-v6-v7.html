<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>byup — Card tavoli · Badge tondo & Costa colorata</title>
<style>
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #F5F6F8;
    color: #0F1115;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─── Palette stati ───
const META = {
  libero:    { accent:'#15803D', label:'Libero',      tint:'rgba(22, 163, 74, 0.10)',  ring:'rgba(22, 163, 74, 0.40)',  soft:'#E9F7EE' },
  prenotato: { accent:'#6D28D9', label:'Prenotato',   tint:'rgba(124, 58, 237, 0.12)', ring:'rgba(124, 58, 237, 0.38)', soft:'#F1EBFC' },
  occupato:  { accent:'#E32459', label:'Occupato',    tint:'rgba(255, 90, 95, 0.18)',  ring:'rgba(227, 36, 89, 0.42)',  soft:'#FDE9EE' },
  dapulire:  { accent:'#B45309', label:'Da liberare', tint:'rgba(217, 119, 6, 0.14)',  ring:'rgba(217, 119, 6, 0.42)',  soft:'#FBF0E1' },
};

const TAVOLI = [
  { id: 3,  state: 'occupato', coperti: 5, posti: 6, sittingMin: 18,
    party: 'Verdi + amici', byupApp: 3, byupWeb: 1,
    chips: [{tipo:'evento', testo:'Compleanno'}, {tipo:'generica', testo:'Servire al tavolo con tovaglia bianca'}],
    ordini: 7, conto: 42.50, pagatoApp: 18.00 },
  { id: 7,  state: 'occupato', coperti: 7, posti: 8, sittingMin: 30, allergia: 'Allergia glutine · 1 ospite',
    party: 'Bucci e famiglia', byupApp: 2, byupWeb: 0,
    ordini: 12, conto: 142.00, pagatoApp: 0 },
  { id: 13, state: 'occupato', coperti: 2, posti: 4, sittingMin: 62, alert: "Non ordina da 28'",
    party: 'Tavolo walk-in', byupApp: 0, byupWeb: 1,
    ordini: 4, conto: 41.00, pagatoApp: 12.50 },
  { id: 4,  state: 'prenotato', res: { time: '20:30', name: 'Martina Franco', posti: 4, tel: '+39 333 000 0000' }, minAlla: 25,
    chips: [{tipo:'evento', testo:'Anniversario'}] },
  { id: 10, state: 'prenotato', res: { time: '20:45', name: 'Bruno Bucciarati', posti: 6, tel: '+39 348 111 2233' }, minAlla: -18 },
  { id: 6,  state: 'dapulire',  posti: 4, minutiDaPulire: 8,  res: { time: '21:30', name: 'Conte' } },
  { id: 16, state: 'dapulire',  posti: 2, minutiDaPulire: 26 },
  { id: 2,  state: 'libero',    posti: 2, res: { time: '22:00', name: 'Bianchi', posti: 2 } },
];
const isLate = t => t.state === 'prenotato' && t.minAlla != null && t.minAlla < 0;
const lateMin = t => Math.abs(t.minAlla || 0);
const urgent = t => (isLate(t) && lateMin(t) > 20) || (t.state === 'dapulire' && (t.minutiDaPulire || 0) > 20);
const seats = t => t.state === 'occupato' ? t.coperti : (t.res && t.res.posti) || t.posti;
const infoText = t => {
  if (t.state === 'occupato')  return t.alert || (t.allergia ? 'Allergia al tavolo' : `Al tavolo da ${t.sittingMin}'`);
  if (t.state === 'prenotato') return `${t.res.time} · ${t.res.name}` + (isLate(t) ? ` · ritardo ${lateMin(t)}'` : '');
  if (t.state === 'dapulire')  return `Liberato ${t.minutiDaPulire}' fa` + (t.res ? ` · poi ${t.res.time}` : '');
  return t.res ? `Prossima ${t.res.time} · ${t.res.name}` : 'Nessuna prenotazione';
};
const EUR = n => '€' + n.toFixed(2).replace('.', ',');

// Curve — V6 rimbalza (overshoot), V7 si distende morbida
const EASE_POP    = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
const EASE_SMOOTH = 'cubic-bezier(0.22, 1, 0.36, 1)';

// ─── Icone e pezzi condivisi ───
function PeopleIcon({ size = 14, color = '#9CA3AF' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
  );
}
function PencilIcon({ size = 12 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
    </svg>
  );
}
const CHIP_META = {
  evento:   { color:'#6D28D9', bg:'#EDE9FE', icon:'M5.8 11.3 2 22l10.7-3.79 M9.6 4.6A2 2 0 1 1 11 8L7 13l-2-2 4-4z M12.5 8.5l5.5 5.5 M15 2h.01 M22 8h.01' },
  generica: { color:'#6B7280', bg:'#F3F4F6', icon:'M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11l5-5V5a2 2 0 0 0-2-2z M16 21v-5a2 2 0 0 1 2-2h3' },
};
function NoteChip({ tipo, testo }) {
  const m = CHIP_META[tipo] || CHIP_META.generica;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap: 6,
      padding:'5px 11px', borderRadius: 10,
      background: m.bg, color: m.color,
      fontSize: 13.5, fontWeight: 600, maxWidth:'100%',
    }}>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
        <path d={m.icon}/>
      </svg>
      <span style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{testo}</span>
    </span>
  );
}
function ByupAvatars({ app = 0, web = 0 }) {
  const tot = app + web;
  if (!tot) return null;
  const dots = [
    ...Array.from({length: app}, (_, i) => ({ key:'a'+i, bg:'linear-gradient(135deg, #FF5A5F, #E32459)' })),
    ...Array.from({length: web}, (_, i) => ({ key:'w'+i, bg:'linear-gradient(135deg, #3B82F6, #2563EB)' })),
  ];
  return (
    <span style={{display:'inline-flex', alignItems:'center'}}>
      {dots.map((d, i) => (
        <span key={d.key} style={{
          width: 20, height: 20, borderRadius:'50%', background: d.bg,
          color:'#fff', fontSize: 11, fontWeight: 800,
          display:'inline-grid', placeItems:'center',
          marginLeft: i === 0 ? 0 : -6, boxShadow:'0 0 0 2px #fff',
        }}>b</span>
      ))}
      <span style={{marginLeft: 7, fontSize: 15, fontWeight: 700, fontVariantNumeric:'tabular-nums'}}>{tot}</span>
    </span>
  );
}
function BtnPrimary({ children, full }) {
  return (
    <button style={{
      width: full ? '100%' : undefined,
      padding:'12px 18px', borderRadius: 12, border:'none',
      background:'#0F1115', color:'#fff',
      fontSize: 15.5, fontWeight: 700, cursor:'pointer', fontFamily:'inherit',
      transition:'background 150ms ease-out',
    }}
      onMouseEnter={e => e.currentTarget.style.background='#24262B'}
      onMouseLeave={e => e.currentTarget.style.background='#0F1115'}
    >{children}</button>
  );
}
function BtnGhost({ children, danger }) {
  return (
    <button style={{
      padding:'12px 16px', borderRadius: 12,
      background:'#fff', color: danger ? '#DC2626' : '#0F1115',
      border:`1px solid ${danger ? 'rgba(220,38,38,0.35)' : 'rgba(15,17,21,0.12)'}`,
      fontSize: 14.5, fontWeight: 700, cursor:'pointer', fontFamily:'inherit',
      transition:'background 150ms ease-out',
    }}
      onMouseEnter={e => e.currentTarget.style.background = danger ? '#FEF2F2' : '#F5F5F7'}
      onMouseLeave={e => e.currentTarget.style.background = '#fff'}
    >{children}</button>
  );
}

// Riga con reveal ritardato — per l'entrata a cascata (V6)
function Reveal({ open, i, children }) {
  return (
    <div style={{
      opacity: open ? 1 : 0,
      transform: open ? 'translateY(0) scale(1)' : 'translateY(8px) scale(0.98)',
      transition: `opacity 240ms ease-out ${open ? 80 + i * 50 : 0}ms, transform 420ms ${EASE_POP} ${open ? 80 + i * 50 : 0}ms`,
    }}>{children}</div>
  );
}

// ─── Dettaglio espanso — stesso funzionale del Quadrante ───
function Expanded({ t, open, cascade }) {
  const [ordiniOpen, setOrdiniOpen] = React.useState(false);
  const daIncassare = t.state === 'occupato' ? t.conto - (t.pagatoApp || 0) : 0;
  const W = cascade ? Reveal : ({children}) => <div>{children}</div>;
  let i = 0;

  if (t.state === 'occupato') return (
    <div style={{padding:'2px 14px 14px', display:'flex', flexDirection:'column', gap: 12}}>
      <W open={open} i={i++}>
        <div style={{display:'flex', alignItems:'center', gap: 8}}>
          <span style={{fontSize: 17.5, fontWeight: 800, letterSpacing:'-0.01em', flex: 1, minWidth: 0,
            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.party}</span>
          <span style={{display:'inline-flex', alignItems:'center', gap: 5, flexShrink: 0}}>
            <span style={{fontSize: 15.5, fontWeight: 700, fontVariantNumeric:'tabular-nums'}}>{t.coperti}</span>
            <PeopleIcon size={15}/>
          </span>
        </div>
      </W>
      <W open={open} i={i++}><ByupAvatars app={t.byupApp} web={t.byupWeb}/></W>
      {(t.allergia || (t.chips && t.chips.length > 0)) && (
        <W open={open} i={i++}>
          <div style={{display:'flex', flexDirection:'column', gap: 6, alignItems:'flex-start'}}>
            {t.allergia && <span style={{fontSize: 13.5, fontWeight: 700, color:'#DC2626'}}>{t.allergia}</span>}
            {(t.chips || []).map((c, k) => <NoteChip key={k} {...c}/>)}
          </div>
        </W>
      )}
      <W open={open} i={i++}>
        <div>
          <button onClick={e => { e.stopPropagation(); setOrdiniOpen(o => !o); }} style={{
            width:'100%', display:'flex', alignItems:'center', gap: 8,
            padding:'11px 14px', borderRadius: 12, border:'none',
            background:'rgba(15,17,21,0.045)', cursor:'pointer', fontFamily:'inherit',
          }}>
            <span style={{fontSize: 12.5, fontWeight: 800, letterSpacing:'0.08em', textTransform:'uppercase', color:'#6B7280'}}>
              Ordini · {t.ordini}
            </span>
            <span style={{flex: 1}}/>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
              style={{transform: ordiniOpen ? 'rotate(180deg)' : 'none', transition:`transform 300ms ${EASE_SMOOTH}`}}>
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div style={{display:'grid', gridTemplateRows: ordiniOpen ? '1fr' : '0fr', transition:`grid-template-rows 320ms ${EASE_SMOOTH}`}}>
            <div style={{overflow:'hidden', minHeight: 0}}>
              <div style={{padding:'8px 14px 2px', display:'flex', flexDirection:'column', gap: 6}}>
                {['2× Margherita', '1× Carbonara', '4× Acqua 1L'].map((r, k) => (
                  <div key={k} style={{fontSize: 14, color:'#4B5563', display:'flex', justifyContent:'space-between'}}>
                    <span>{r}</span><span style={{color:'#059669', fontWeight: 700, fontSize: 12.5}}>Servito</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </W>
      <W open={open} i={i++}>
        <div style={{textAlign:'center'}}>
          <button onClick={e => e.stopPropagation()} style={{
            background:'transparent', border:'none', cursor:'pointer', fontFamily:'inherit',
            fontSize: 15, fontWeight: 700, color:'#0F1115',
            textDecoration:'underline', textUnderlineOffset: 3, padding:'2px 0',
          }}>+ Aggiungi articolo</button>
        </div>
      </W>
      <W open={open} i={i++}>
        <div style={{borderTop:'1px solid rgba(15,17,21,0.07)', paddingTop: 10, display:'flex', flexDirection:'column', gap: 5}}>
          <div style={{display:'flex', justifyContent:'space-between', fontSize: 14.5, color:'#6B7280'}}>
            <span>Totale conto</span>
            <span style={{fontVariantNumeric:'tabular-nums'}}>{EUR(t.conto)}</span>
          </div>
          {t.pagatoApp > 0 && (
            <div style={{display:'flex', justifyContent:'space-between', fontSize: 14.5, color:'#6B7280'}}>
              <span>Pagato in app</span>
              <span style={{fontVariantNumeric:'tabular-nums'}}>−{EUR(t.pagatoApp)}</span>
            </div>
          )}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop: 2}}>
            <span style={{fontSize: 15, fontWeight: 600, color:'#6B7280'}}>Da incassare</span>
            <span style={{fontSize: 26, fontWeight: 800, letterSpacing:'-0.02em', fontVariantNumeric:'tabular-nums'}}>{EUR(daIncassare)}</span>
          </div>
        </div>
      </W>
      <W open={open} i={i++}><BtnPrimary full>Salda ora</BtnPrimary></W>
    </div>
  );

  if (t.state === 'prenotato') return (
    <div style={{padding:'2px 14px 14px', display:'flex', flexDirection:'column', gap: 12}}>
      <W open={open} i={i++}>
        <div>
          <div style={{fontSize: 17.5, fontWeight: 800, letterSpacing:'-0.01em'}}>{t.res.time} · {t.res.name}</div>
          {isLate(t) && (
            <div style={{fontSize: 13, fontWeight: 700, color: urgent(t) ? '#DC2626' : '#B45309',
              textTransform:'uppercase', letterSpacing: 0.4, marginTop: 3}}>
              In ritardo di {lateMin(t)} minuti
            </div>
          )}
          <div style={{display:'flex', alignItems:'center', gap: 12, marginTop: 5, fontSize: 14, color:'#6B7280'}}>
            <span style={{display:'inline-flex', alignItems:'center', gap: 5}}>
              {t.res.posti} <PeopleIcon size={13}/>
              <span style={{display:'inline-flex', color:'#9CA3AF'}}><PencilIcon/></span>
            </span>
            <span>{t.res.tel}</span>
          </div>
        </div>
      </W>
      {t.chips && t.chips.length > 0 && (
        <W open={open} i={i++}>
          <div style={{display:'flex', flexDirection:'column', gap: 6, alignItems:'flex-start'}}>
            {t.chips.map((c, k) => <NoteChip key={k} {...c}/>)}
          </div>
        </W>
      )}
      <W open={open} i={i++}>
        <div style={{display:'flex', gap: 8}}>
          <span style={{flex: 1, display:'flex', flexDirection:'column'}}><BtnPrimary full>Apri tavolo</BtnPrimary></span>
          {isLate(t) && <BtnGhost danger>No-show</BtnGhost>}
        </div>
      </W>
    </div>
  );

  if (t.state === 'dapulire') return (
    <div style={{padding:'2px 14px 14px', display:'flex', flexDirection:'column', gap: 12}}>
      <W open={open} i={i++}>
        <div style={{fontSize: 14, color:'#6B7280', lineHeight: 1.5}}>
          Sbarazzo e riassetto{t.res ? <span> — prossima prenotazione <strong style={{color:'#0F1115'}}>{t.res.time}{t.res.name ? ` · ${t.res.name}` : ''}</strong></span> : ''}.
        </div>
      </W>
      <W open={open} i={i++}><BtnPrimary full>Segna come pronto</BtnPrimary></W>
    </div>
  );

  return (
    <div style={{padding:'2px 14px 14px', display:'flex', flexDirection:'column', gap: 12}}>
      <W open={open} i={i++}>
        {t.res ? (
          <div style={{fontSize: 14, color:'#6B7280'}}>
            Prossima prenotazione <strong style={{color:'#0F1115'}}>{t.res.time} · {t.res.name}</strong> · {t.res.posti} coperti
          </div>
        ) : (
          <div style={{fontSize: 14, color:'#6B7280'}}>Nessuna prenotazione in arrivo.</div>
        )}
      </W>
      <W open={open} i={i++}><BtnPrimary full>Apri tavolo</BtnPrimary></W>
    </div>
  );
}

// Header espanso comune: Modifica pill
function ModificaPill({ open }) {
  return (
    <span style={{
      overflow:'hidden',
      maxWidth: open ? 110 : 0,
      opacity: open ? 1 : 0,
      transition: `max-width 340ms ${EASE_SMOOTH}, opacity 220ms ease-out ${open ? '80ms' : '0ms'}`,
      flexShrink: 0, display:'inline-flex',
    }}>
      <button onClick={e => e.stopPropagation()} style={{
        display:'inline-flex', alignItems:'center', gap: 5,
        padding:'6px 12px', borderRadius: 999,
        background:'#fff', color:'#0F1115',
        border:'1px solid rgba(15,17,21,0.12)',
        fontSize: 13, fontWeight: 700, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap',
      }}>
        <PencilIcon/> Modifica
      </button>
    </span>
  );
}

// ═══════════════════════════════════════════════════════════════
// V6 · BADGE TONDO — apertura "pop": rimbalzo elastico, badge che
//     fa uno squash giocoso, contenuto a cascata
// ═══════════════════════════════════════════════════════════════
function CardBadge({ t }) {
  const m = META[t.state];
  const [open, setOpen] = React.useState(false);
  const [hover, setHover] = React.useState(false);
  return (
    <div
      onClick={() => setOpen(o => !o)}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background:'#fff', borderRadius: 16, cursor:'pointer',
        border:'1px solid rgba(15,17,21,0.06)',
        boxShadow: open
          ? `0 16px 36px -10px ${m.accent}35, 0 2px 6px rgba(15,17,21,0.05)`
          : hover
            ? '0 8px 20px rgba(15,17,21,0.08), 0 1px 3px rgba(15,17,21,0.04)'
            : '0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
        transform: open ? 'scale(1.012)' : hover ? 'translateY(-2px)' : 'none',
        transition: `transform 480ms ${EASE_POP}, box-shadow 380ms ${EASE_SMOOTH}`,
        alignSelf:'start', overflow:'hidden',
      }}>
      {/* Riga badge */}
      <div style={{display:'flex', alignItems:'center', gap: 12, padding:'12px 14px', minHeight: 82}}>
        <div style={{position:'relative', flexShrink: 0}}>
          <div style={{
            width: 54, height: 54, borderRadius:'50%',
            background: m.soft, boxShadow:`inset 0 0 0 2px ${m.accent}55`,
            display:'grid', placeItems:'center',
            // Squash & stretch giocoso all'apertura
            transform: open ? 'scale(1.12) rotate(-6deg)' : 'scale(1) rotate(0deg)',
            transition: `transform 520ms ${EASE_POP}`,
          }}>
            <div style={{textAlign:'center', lineHeight: 1}}>
              <div style={{fontSize: 10, fontWeight: 800, letterSpacing:'0.09em', color: m.accent, marginBottom: 2}}>TAV</div>
              <div style={{fontSize: 21, fontWeight: 900, color:'#0F1115'}}>{t.id}</div>
            </div>
          </div>
          {urgent(t) && <span style={{position:'absolute', top: -2, right: -2, width: 13, height: 13, borderRadius:'50%', background:'#DC2626', boxShadow:'0 0 0 2px #fff'}}/>}
        </div>
        <div style={{flex: 1, minWidth: 0}}>
          <div style={{display:'flex', alignItems:'baseline', gap: 6}}>
            <span style={{fontSize: 14.5, fontWeight: 800, color: m.accent}}>{m.label}</span>
            {t.state==='occupato' && <span style={{fontSize: 12, color:'#9CA3AF'}}>· {t.sittingMin}'</span>}
          </div>
          <div style={{fontSize: 13, color:'#6B7280', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop: 2}}>
            {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}{infoText(t)}
          </div>
        </div>
        <ModificaPill open={open}/>
        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap: 3, flexShrink: 0}}>
          <span style={{fontSize: 15, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)}<span style={{fontSize: 11, color:'#9CA3AF', fontWeight: 600}}>p</span></span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.4"
            strokeLinecap="round" strokeLinejoin="round"
            style={{transform: open ? 'rotate(180deg)' : 'none', transition:`transform 480ms ${EASE_POP}`}}>
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
      {/* Dettaglio — molla con rimbalzo + cascata */}
      <div style={{
        display:'grid',
        gridTemplateRows: open ? '1fr' : '0fr',
        transition: `grid-template-rows 460ms ${open ? EASE_POP : EASE_SMOOTH}`,
        borderTop: open ? '1px solid rgba(15,17,21,0.07)' : '1px solid rgba(15,17,21,0)',
      }}>
        <div style={{overflow:'hidden', minHeight: 0}}>
          <div style={{paddingTop: 12}}>
            <Expanded t={t} open={open} cascade/>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// V7 · COSTA COLORATA — apertura "cartellina": la costa si accende
//     e si allarga, il dettaglio si spiega con una piega 3D
// ═══════════════════════════════════════════════════════════════
function CardCosta({ t }) {
  const m = META[t.state];
  const [open, setOpen] = React.useState(false);
  const [hover, setHover] = React.useState(false);
  return (
    <div
      onClick={() => setOpen(o => !o)}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background:'#fff', borderRadius: 14, cursor:'pointer',
        border:`1px solid ${open ? m.ring : 'rgba(15,17,21,0.07)'}`,
        boxShadow: open
          ? `0 16px 36px -10px ${m.accent}30, 0 2px 6px rgba(15,17,21,0.05)`
          : hover
            ? `0 8px 20px -6px ${m.accent}22, 0 1px 3px rgba(15,17,21,0.04)`
            : '0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
        transform: hover && !open ? 'translateY(-2px)' : 'none',
        transition: `transform 300ms ${EASE_SMOOTH}, box-shadow 380ms ${EASE_SMOOTH}, border-color 260ms ease-out`,
        alignSelf:'start', overflow:'hidden',
        display:'flex',
      }}>
      {/* Costa — si allarga e si accende quando la card si apre */}
      <div style={{
        width: open ? 42 : 34, flexShrink: 0, alignSelf:'stretch',
        background: open ? m.accent : m.soft,
        borderRight: `1px solid ${m.ring}`,
        display:'flex', alignItems:'center', justifyContent:'center',
        transition: `width 420ms ${EASE_SMOOTH}, background 320ms ease-out`,
      }}>
        <span style={{
          writingMode:'vertical-rl', transform:'rotate(180deg)',
          fontSize: 10.5, fontWeight: 800, letterSpacing:'0.16em', textTransform:'uppercase',
          color: open ? '#fff' : m.accent, whiteSpace:'nowrap',
          transition:'color 320ms ease-out',
        }}>{m.label}</span>
      </div>
      {/* Corpo */}
      <div style={{flex: 1, minWidth: 0, display:'flex', flexDirection:'column'}}>
        <div style={{padding:'11px 14px', display:'flex', flexDirection:'column', gap: 4, minHeight: 82, justifyContent:'center'}}>
          <div style={{display:'flex', alignItems:'center', gap: 8}}>
            <span style={{fontSize: 18, fontWeight: 800, letterSpacing:'-0.02em', whiteSpace:'nowrap'}}>Tavolo {t.id}</span>
            {t.state==='occupato' && <span style={{fontSize: 12.5, color:'#9CA3AF', fontWeight: 600}}>· {t.sittingMin}'</span>}
            {urgent(t) && !open && <span style={{fontSize: 11, fontWeight: 800, color:'#fff', background:'#DC2626', padding:'2px 8px', borderRadius: 999, whiteSpace:'nowrap'}}>+20'</span>}
            <span style={{flex: 1, minWidth: 8}}/>
            <ModificaPill open={open}/>
            <span style={{fontSize: 14, fontWeight: 800, fontVariantNumeric:'tabular-nums', flexShrink: 0}}>{seats(t)}<span style={{fontSize: 11, color:'#9CA3AF', fontWeight: 600}}>p</span></span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.4"
              strokeLinecap="round" strokeLinejoin="round"
              style={{transform: open ? 'rotate(180deg)' : 'none', transition:`transform 420ms ${EASE_SMOOTH}`, flexShrink: 0}}>
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div style={{fontSize: 13, color:'#4B5563', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
            {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}{infoText(t)}
          </div>
        </div>
        {/* Dettaglio — si "spiega" con piega 3D dall'alto */}
        <div style={{
          display:'grid',
          gridTemplateRows: open ? '1fr' : '0fr',
          transition: `grid-template-rows 440ms ${EASE_SMOOTH}`,
          borderTop: open ? '1px solid rgba(15,17,21,0.07)' : '1px solid rgba(15,17,21,0)',
          perspective: 700,
        }}>
          <div style={{
            overflow:'hidden', minHeight: 0,
            opacity: open ? 1 : 0,
            transform: open ? 'rotateX(0deg) translateY(0)' : 'rotateX(-14deg) translateY(-10px)',
            transformOrigin:'top center',
            transition: `opacity 280ms ease-out ${open ? '90ms' : '0ms'}, transform 500ms ${EASE_SMOOTH} ${open ? '40ms' : '0ms'}`,
          }}>
            <div style={{paddingTop: 12}}>
              <Expanded t={t} open={open}/>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{maxWidth: 1180, margin:'0 auto', padding:'36px 24px 80px'}}>
      <h1 style={{fontSize: 26, fontWeight: 800, letterSpacing:'-0.02em', margin:'0 0 4px'}}>Badge tondo & Costa colorata — apribili</h1>
      <p style={{fontSize: 15, color:'#6B7280', margin:'0 0 32px', maxWidth: 800, lineHeight: 1.55}}>
        Stesso contenuto completo del Quadrante (party, presenze byup, note, ordini, totali, CTA nera),
        due personalità diverse. <strong>Clicca le card</strong>: la 6 fa un <em>pop</em> elastico col badge che
        si stiracchia e il contenuto a cascata; la 7 si apre come una <em>cartellina</em> — la costa si accende
        e il dettaglio si spiega con una piega.
      </p>

      <section style={{marginBottom: 46}}>
        <h2 style={{fontSize: 19, fontWeight: 800, margin:'0 0 2px'}}><span style={{color:'#FF5A5F'}}>6</span> · Badge tondo</h2>
        <p style={{fontSize: 14, color:'#6B7280', margin:'0 0 14px'}}>TAV più leggibile, numero più pesante. Apertura elastica con rimbalzo e contenuto a cascata.</p>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap: 14, alignItems:'start'}}>
          {TAVOLI.map(t => <CardBadge key={t.id} t={t}/>)}
        </div>
      </section>

      <section>
        <h2 style={{fontSize: 19, fontWeight: 800, margin:'0 0 2px'}}><span style={{color:'#FF5A5F'}}>7</span> · Costa colorata</h2>
        <p style={{fontSize: 14, color:'#6B7280', margin:'0 0 14px'}}>La costa si accende del colore pieno quando apri e si allarga leggermente; il dettaglio si spiega con una piega 3D. Badge +20' e hover tinto.</p>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap: 14, alignItems:'start'}}>
          {TAVOLI.map(t => <CardCosta key={t.id} t={t}/>)}
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
