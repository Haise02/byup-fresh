<title>byup — Sala</title>
<link rel="icon" type="image/png" href="/assets/byup-icon.png?v=2"/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #ECEEF1;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    /* Centra il frame: zoom proporzionale via JS (fondo pagina) */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    width: 1440px;
    margin: 24px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-shrink: 0;
  }
  .pn-scroll::-webkit-scrollbar { width: 8px; height:8px; }
  .pn-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .pn-scroll::-webkit-scrollbar-track { background: transparent; }
  /* Timeline prenotazioni: scrollbar nativa nascosta — usiamo quella custom JS */
  .byup-tl-scroll::-webkit-scrollbar { display: none; }
  .byup-tl-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  input, textarea, select { font-family: inherit; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }
  /* Popup calendario: overlay in dissolvenza + card con pop elastico */
  @keyframes calOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes calPopIn {
    0% { opacity: 0; transform: scale(0.92) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  /* Scossa di rifiuto sugli slot byup (stile macOS "denied") */
  @keyframes byupDeny {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  /* Feedback di pressione: ogni bottone si comprime leggermente al click */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>
</head>
<body>
<div id="root"></div>
