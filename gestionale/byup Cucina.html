<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="pn-device.js?v=a11y"></script>
<script src="byup-fit.js?v=a11y7"></script>
<title>byup — Cucina</title>
<link rel="icon" type="image/png" href="/assets/byup-icon.png?v=2"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-byup.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #ECEEF1;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    /* Centra il frame: zoom proporzionale via JS (fondo pagina) */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    width: 1440px;
    margin: 24px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-shrink: 0;
  }
  .pn-scroll::-webkit-scrollbar { width: 8px; height:8px; }
  .pn-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .pn-scroll::-webkit-scrollbar-track { background: transparent; }
  input, textarea, select { font-family: inherit; }
  /* Feedback di pressione: ogni bottone si comprime leggermente al click */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="panoramica-tokens.jsx?v=a11y"></script>
<script type="text/babel" src="byup-a11y.jsx?v=a11y4"></script>
<script type="text/babel" src="byup-glass.jsx?v=a11y"></script>
<script type="text/babel" src="panoramica-icons.jsx?v=a11y"></script>
<script type="text/babel" src="panoramica-sf-icons.jsx?v=a11y"></script>
<script type="text/babel" src="panoramica-sidebar.jsx?v=a11y4"></script>
<script type="text/babel" src="panoramica-plan-card.jsx?v=a11y"></script>
<script type="text/babel" src="panoramica-notif-bell.jsx?v=a11y"></script>
<script type="text/babel" src="app-page-shell.jsx?v=a11y"></script>
<script type="text/babel" src="cucina-data.jsx?v=a11y"></script>
<!-- La vista «Ristorante» non e' piu' i ticket a colonne: e' la board per
     TAVOLO (kds-tavoli.jsx, piu' in basso). Di quel che c'era resta questo,
     che serve anche al Pub — cornice, chip dei filtri, icone dello schermo
     intero. -->
<script type="text/babel" src="cucina-shared.jsx?v=a11y"></script>
<!-- Board del KDS v2: è la cucina di un monitor collegato come «Pub».
     Solo modello, dati e vista — non il suo montaggio (cucina-kds2-app.jsx),
     che ha una root sua e serve alla route di anteprima. -->
<script type="text/babel" src="cucina-kds2-data.jsx?v=a11y"></script>
<script type="text/babel" src="cucina-kds2-mock.jsx?v=a11y"></script>
<script type="text/babel" src="stampa.jsx?v=a11y"></script>
<script type="text/babel" src="cucina-kds2-board.jsx?v=a11y2"></script>
<script type="text/babel" src="cucina-kds2-da-cucina.jsx?v=a11y"></script>

<!-- La board per TAVOLO: prende il posto della vista «Ristorante». Stessa
     tripletta della board Pub — modulo, dati finti (che qui non servono) e
     adattatore dal servizio. -->
<script type="text/babel" src="kds-tavoli.jsx?v=a11y2"></script>
<script type="text/babel" src="kds-tavoli-da-cucina.jsx?v=a11y"></script>
<script type="text/babel" src="cucina-app.jsx?v=a11y"></script>
<!-- Assistente IA fluttuante: si monta da solo dentro .frame -->
<script type="text/babel" src="byup-ai-fab.jsx?v=a11y"></script>
<script type="text/babel" src="pn-tooltip.jsx?v=a11y"></script>
</body>
</html>
