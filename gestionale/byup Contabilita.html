<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="pn-device.js?v=3"></script>
<title>byup — Contabilità</title>
<link rel="icon" type="image/png" href="/assets/byup-icon.png?v=2"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-byup.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #ECEEF1;
    color: #0F1115;
    -webkit-font-smoothing: antialiased;
    /* Centra il frame: lo zoom proporzionale è applicato via JS (vedi fondo pagina) */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    /* Dimensione di design fissa; la scala alla finestra avviene con zoom (JS) */
    width: 1440px;
    height: 900px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-shrink: 0;
  }
  .pn-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .pn-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .pn-scroll::-webkit-scrollbar-track { background: transparent; }

  @keyframes cassaPopIn {
    0%   { opacity: 0; transform: translate(-50%, -46%) scale(0.94); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes cassaPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 90, 95, 0.45); }
    70%  { box-shadow: 0 0 0 10px rgba(255, 90, 95, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 90, 95, 0); }
  }
  .cassa-btn {
    transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
  }
  .cassa-btn:hover { filter: brightness(1.12); }
  .cassa-btn:active { transform: scale(0.95); }
  /* Feedback di pressione: ogni bottone si comprime leggermente al click */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="panoramica-tokens.jsx"></script>
<script type="text/babel" src="byup-glass.jsx"></script>
<script type="text/babel" src="panoramica-icons.jsx"></script>
<script type="text/babel" src="panoramica-sidebar.jsx?v=4"></script>
<script type="text/babel" src="panoramica-plan-card.jsx"></script>
<script type="text/babel" src="panoramica-notif-bell.jsx"></script>

<script type="text/babel" src="contabilita-data.jsx?v=2"></script>
<script type="text/babel" src="contabilita-v2-tokens.jsx"></script>
<script type="text/babel" src="contabilita-v2-icons.jsx"></script>
<!-- panoramica-sf-icons DEVE caricarsi DOPO contabilita-v2-icons.jsx: entrambi
     definiscono un `Icon` globale, ma con API diverse (v2-icons usa {d, size}
     path-based, sf-icons usa {name, size} name-based). contabilita-v2-app.jsx
     usa <Icon name="..."/>, quindi vince l'ultimo. L'oggetto `Ic` di v2-icons
     non viene toccato e i suoi consumer (v2-cassa, v2-costi, v2-iva-export)
     continuano a funzionare. -->
<script type="text/babel" src="panoramica-sf-icons.jsx"></script>
<script type="text/babel" src="contabilita-v2-cassa.jsx?v=18"></script>
<script type="text/babel" src="contabilita-v2-costi.jsx?v=2"></script>
<script type="text/babel" src="contabilita-v2-iva-export.jsx?v=2"></script>
<!-- La finestra della fattura è la stessa dell'incasso in Vendita diretta e
     la apre anche il salda conto: va caricata prima di lui. -->
<script type="text/babel" src="sala-fattura-modal.jsx"></script>
<script type="text/babel" src="sala-salda-modal.jsx?v=28"></script>
<!-- I conti della vendita diretta nascono in Sala: qui servono i loro dati e
     la traduzione ordine → conto, che sta accanto agli ordini. -->
<script type="text/babel" src="sala-vendita-data.jsx?v=6"></script>
<script type="text/babel" src="contabilita-v2-conti.jsx?v=10"></script>
<script type="text/babel" src="contabilita-v2-fatture.jsx"></script>
<script type="text/babel" src="contabilita-v2-app.jsx?v=6"></script>
<!-- Assistente IA fluttuante: si monta da solo dentro .frame -->
<script type="text/babel" src="byup-ai-fab.jsx"></script>
<script type="text/babel" src="pn-tooltip.jsx"></script>

<!-- Zoom proporzionale: scala l'intero gestionale in base alla finestra del desktop -->
<script>
(function () {
  var DESIGN_H = 900, MARGIN = 24, MIN_W = 1280;
  // Zoom guidato dall'altezza: tutta la UI scala in proporzione al desktop.
  // Larghezza fluida: dopo lo zoom il frame riempie la larghezza disponibile.
  var cur = { frame: null, zoom: null, width: null };
  function fit() {
    var frame = document.querySelector('.frame');
    if (!frame) return;
    // Layout nativo (telefono/tablet adattato): lo zoom si mette da parte
    // e pulisce quel che aveva scritto — comanda il CSS di pn-device.
    if (document.documentElement.hasAttribute('data-pn-native')) {
      if (cur.zoom !== null) { frame.style.zoom = ''; frame.style.width = ''; cur = { frame: null, zoom: null, width: null }; }
      return;
    }
    var s = (window.innerHeight - MARGIN) / DESIGN_H;
    s = Math.max(0.4, Math.min(2.2, s));
    var w = Math.max(MIN_W, (window.innerWidth - MARGIN) / s);
    if (frame !== cur.frame || s !== cur.zoom) frame.style.zoom = s;
    if (frame !== cur.frame || w !== cur.width) frame.style.width = w + 'px';
    cur = { frame: frame, zoom: s, width: w };
  }
  window.addEventListener('resize', fit);
  // Il frame lo monta React dopo la compilazione Babel (async, da CDN): al
  // primo load può non esistere ancora e i retry a tempo fisso perdevano la
  // gara su rete lenta. L'observer applica il fit appena il frame compare
  // (e su ogni remount): adattamento al primo colpo, senza refresh.
  new MutationObserver(fit).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
  fit();
})();
</script>
</body>
</html>
