<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>byup — Card tavoli · 10 varianti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F5F6F8;
    color: #0F1115;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─── Palette stati (tinte di sistema byup) ───
const META = {
  libero:    { accent:'#15803D', label:'Libero',      tint:'rgba(22, 163, 74, 0.10)',  ring:'rgba(22, 163, 74, 0.40)',  soft:'#E9F7EE' },
  prenotato: { accent:'#6D28D9', label:'Prenotato',   tint:'rgba(124, 58, 237, 0.12)', ring:'rgba(124, 58, 237, 0.38)', soft:'#F1EBFC' },
  occupato:  { accent:'#E32459', label:'Occupato',    tint:'rgba(255, 90, 95, 0.18)',  ring:'rgba(227, 36, 89, 0.42)',  soft:'#FDE9EE' },
  dapulire:  { accent:'#B45309', label:'Da liberare', tint:'rgba(217, 119, 6, 0.14)',  ring:'rgba(217, 119, 6, 0.42)',  soft:'#FBF0E1' },
};

// ─── Dati di esempio — identici per tutti i blocchi ───
const TAVOLI = [
  { id: 1,  state: 'occupato',  coperti: 4, posti: 4, sittingMin: 45 },
  { id: 7,  state: 'occupato',  coperti: 7, posti: 8, sittingMin: 30, allergia: true },
  { id: 13, state: 'occupato',  coperti: 2, posti: 4, sittingMin: 62, alert: "Non ordina da 28'" },
  { id: 4,  state: 'prenotato', res: { time: '20:30', name: 'Martina Franco', posti: 4 }, minAlla: 25 },
  { id: 10, state: 'prenotato', res: { time: '20:45', name: 'Bruno Bucciarati', posti: 6 }, minAlla: -18 },
  { id: 6,  state: 'dapulire',  posti: 4, minutiDaPulire: 8,  res: { time: '21:30' } },
  { id: 16, state: 'dapulire',  posti: 2, minutiDaPulire: 26 },
  { id: 2,  state: 'libero',    posti: 2, res: { time: '22:00', name: 'Bianchi' } },
];
const isLate = t => t.state === 'prenotato' && t.minAlla != null && t.minAlla < 0;
const lateMin = t => Math.abs(t.minAlla || 0);
const urgent = t => (isLate(t) && lateMin(t) > 20) || (t.state === 'dapulire' && (t.minutiDaPulire || 0) > 20);
const seats = t => t.state === 'occupato' ? t.coperti : (t.res && t.res.posti) || t.posti;
// Riga informativa principale, testuale — riusata dove serve
const infoText = t => {
  if (t.state === 'occupato')  return t.alert || (t.allergia ? 'Allergia al tavolo' : `Al tavolo da ${t.sittingMin}'`);
  if (t.state === 'prenotato') return `${t.res.time} · ${t.res.name}` + (isLate(t) ? ` · ritardo ${lateMin(t)}'` : '');
  if (t.state === 'dapulire')  return `Liberato ${t.minutiDaPulire}' fa` + (t.res ? ` · poi ${t.res.time}` : '');
  return t.res ? `Prossima ${t.res.time} · ${t.res.name}` : 'Nessuna prenotazione';
};

// ═══════════════════════════════════════════════════════════════
// 1 · SEGNAPOSTO — lusso da tavola: serif, cornice doppia, centrato
// ═══════════════════════════════════════════════════════════════
function V1({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      background:'#FFFDF9', borderRadius: 4, padding: 18, textAlign:'center',
      border:'1px solid #E4DDD2', boxShadow:'0 2px 10px rgba(60,45,30,0.06)',
      position:'relative', minHeight: 150, display:'flex', flexDirection:'column', justifyContent:'center', gap: 6,
    }}>
      <div style={{position:'absolute', inset: 6, border:`1px solid ${m.accent}33`, borderRadius: 2, pointerEvents:'none'}}/>
      <div style={{fontFamily:'Fraunces, serif', fontSize: 13, letterSpacing:'0.22em', color:'#8A8072', textTransform:'uppercase'}}>Tavolo</div>
      <div style={{fontFamily:'Fraunces, serif', fontSize: 44, fontWeight: 600, lineHeight: 1, color:'#1C1710'}}>{t.id}</div>
      <div style={{fontSize: 11.5, fontWeight: 700, letterSpacing:'0.14em', textTransform:'uppercase', color: m.accent}}>
        {urgent(t) ? '⚠ ' : ''}{m.label}{t.state==='occupato' ? ` · ${t.sittingMin}'` : ''}
      </div>
      <div style={{fontSize: 12.5, color:'#6B6459', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{infoText(t)}</div>
      <div style={{fontSize: 12, color:'#8A8072'}}>{seats(t)} coperti</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 2 · REGISTRO DI SALA — righe editoriali, colonna orari, hairline
// ═══════════════════════════════════════════════════════════════
function V2({ t }) {
  const m = META[t.state];
  const time = t.state === 'occupato' ? `${t.sittingMin}'` : (t.res ? t.res.time : '—');
  return (
    <div style={{
      display:'grid', gridTemplateColumns:'64px 110px 1fr auto', alignItems:'center', gap: 14,
      padding:'13px 16px', background:'#fff',
      borderBottom:'1px solid rgba(15,17,21,0.07)',
      borderLeft:`3px solid ${urgent(t) ? '#DC2626' : m.accent}`,
    }}>
      <span style={{fontFamily:'Fraunces, serif', fontSize: 19, fontWeight: 700}}>Tav.{t.id}</span>
      <span style={{fontFamily:'IBM Plex Mono, monospace', fontSize: 14, fontWeight: 600, color: t.res || t.state==='occupato' ? '#0F1115' : '#9CA3AF'}}>{time}</span>
      <span style={{fontSize: 14, color:'#4B5563', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
        {t.allergia && <strong style={{color:'#DC2626'}}>ALLERGIA · </strong>}
        {t.state === 'prenotato' || t.state === 'libero' ? (t.res ? t.res.name : 'Nessuna prenotazione') : infoText(t)}
      </span>
      <span style={{display:'inline-flex', alignItems:'center', gap: 8}}>
        <span style={{fontSize: 13.5, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)}p</span>
        <span style={{fontSize: 11, fontWeight: 800, letterSpacing:'0.08em', textTransform:'uppercase', color: m.accent}}>{m.label}</span>
      </span>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 3 · COMANDA POS — monospace, tratteggio, timbro di stato
// ═══════════════════════════════════════════════════════════════
function V3({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      fontFamily:'IBM Plex Mono, monospace',
      background:'#FFFFFF', border:'1.5px dashed #C9CDD4', borderRadius: 8,
      padding:'14px 16px', minHeight: 140, position:'relative', overflow:'hidden',
      boxShadow:'0 3px 10px rgba(15,17,21,0.05)',
    }}>
      <div style={{
        position:'absolute', top: 14, right: -26, transform:'rotate(24deg)',
        fontSize: 11, fontWeight: 700, letterSpacing:'0.14em', textTransform:'uppercase',
        color: m.accent, border:`2px solid ${m.accent}`, padding:'3px 30px',
        opacity: 0.85, borderRadius: 3,
      }}>{m.label}</div>
      <div style={{fontSize: 12, color:'#9CA3AF'}}>== BYUP FRESH ==</div>
      <div style={{fontSize: 22, fontWeight: 700, margin:'6px 0 8px'}}>TAV. {String(t.id).padStart(2,'0')}</div>
      <div style={{fontSize: 12.5, lineHeight: 1.8, color:'#374151'}}>
        <div>COPERTI ....... {seats(t)}</div>
        {t.state === 'occupato' && <div>AL TAVOLO ..... {t.sittingMin}'</div>}
        {t.res && t.res.time && <div>{t.state === 'occupato' ? 'PROSSIMA' : 'ORE'} ....... {t.res.time}</div>}
        {t.res && t.res.name && <div style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>NOME .......... {t.res.name.toUpperCase()}</div>}
        {t.alert && <div style={{color:'#B45309'}}>! {t.alert.toUpperCase()}</div>}
        {t.allergia && <div style={{color:'#DC2626'}}>!! ALLERGIA</div>}
        {isLate(t) && <div style={{color:'#B45309'}}>! RITARDO {lateMin(t)}'</div>}
        {t.state === 'dapulire' && <div style={{color: urgent(t) ? '#DC2626' : '#6B7280'}}>LIBERATO {t.minutiDaPulire}' FA</div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 4 · AURORA GLASS — vetro chiaro su mesh coral (L2)
// ═══════════════════════════════════════════════════════════════
function V4({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      background:'rgba(255,255,255,0.62)',
      backdropFilter:'blur(20px) saturate(150%)', WebkitBackdropFilter:'blur(20px) saturate(150%)',
      border:'1px solid rgba(255,255,255,0.85)', borderRadius: 18,
      padding:'14px 16px', minHeight: 118,
      boxShadow:'inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 28px rgba(140,50,70,0.10)',
      display:'flex', flexDirection:'column', gap: 6,
    }}>
      <div style={{display:'flex', alignItems:'center', gap: 8}}>
        <span style={{fontSize: 19, fontWeight: 800, letterSpacing:'-0.02em'}}>Tavolo {t.id}</span>
        <span style={{flex:1}}/>
        <span style={{
          padding:'3px 10px', borderRadius: 999, fontSize: 11.5, fontWeight: 800,
          background: m.tint, boxShadow:`inset 0 0 0 1px ${m.ring}`, color: m.accent,
          textTransform:'uppercase', letterSpacing:'0.05em',
        }}>{m.label}</span>
      </div>
      <div style={{fontSize: 13.5, color:'#374151', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
        {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}{infoText(t)}
      </div>
      <div style={{marginTop:'auto', display:'flex', alignItems:'center'}}>
        {urgent(t) && <span style={{fontSize: 12, fontWeight: 800, color:'#DC2626'}}>⚠ da oltre 20'</span>}
        <span style={{marginLeft:'auto', fontSize: 14.5, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)} <span style={{fontWeight: 500, color:'#6B7280', fontSize: 12}}>coperti</span></span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 5 · SUNSET NIGHT — sala serale, tutte in vetro scuro wine
// ═══════════════════════════════════════════════════════════════
function V5({ t }) {
  const m = META[t.state];
  const inkMap = { occupato:'#FF9A9E', prenotato:'#C4B5FD', libero:'#6EE7B7', dapulire:'#FCD34D' };
  const ink = inkMap[t.state];
  return (
    <div style={{
      background:`radial-gradient(circle at 84% 10%, rgba(255,96,102,0.18), transparent 55%), linear-gradient(180deg, #2C0C10 0%, #180608 100%)`,
      borderRadius: 18, padding:'14px 16px', minHeight: 118, color:'#F5F5F7',
      boxShadow:`inset 0 1px 0 rgba(255,200,210,0.16), inset 0 0 0 1px rgba(255,130,150,0.10), ${urgent(t) ? '0 0 0 3px rgba(255,90,95,0.25),' : ''} 0 12px 30px -12px rgba(80,10,30,0.6)`,
      display:'flex', flexDirection:'column', gap: 6,
    }}>
      <div style={{display:'flex', alignItems:'baseline', gap: 8}}>
        <span style={{fontSize: 19, fontWeight: 800, letterSpacing:'-0.02em'}}>Tav. {t.id}</span>
        <span style={{fontSize: 11.5, fontWeight: 800, letterSpacing:'0.1em', textTransform:'uppercase', color: ink}}>{m.label}</span>
        <span style={{flex:1}}/>
        {t.state==='occupato' && <span style={{fontSize: 13, color:'rgba(255,255,255,0.55)', fontVariantNumeric:'tabular-nums'}}>{t.sittingMin}'</span>}
      </div>
      <div style={{fontSize: 13.5, color:'rgba(255,255,255,0.78)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
        {t.allergia && <strong style={{color:'#FF9A9E'}}>Allergia · </strong>}{infoText(t)}
      </div>
      <div style={{marginTop:'auto', display:'flex', alignItems:'center'}}>
        {urgent(t) && (
          <span style={{fontSize: 11.5, fontWeight: 800, color:'#FF9A9E', background:'rgba(255,90,95,0.16)',
            boxShadow:'inset 0 0 0 1px rgba(255,90,95,0.45)', padding:'2px 9px', borderRadius: 999}}>URGENTE</span>
        )}
        <span style={{marginLeft:'auto', fontSize: 14.5, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)} <span style={{fontWeight: 500, color:'rgba(255,255,255,0.5)', fontSize: 12}}>coperti</span></span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 6 · BADGE TONDO — cerchio di stato col numero, stile conversazioni
// ═══════════════════════════════════════════════════════════════
function V6({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      background:'#fff', borderRadius: 16, padding:'12px 14px',
      border:'1px solid rgba(15,17,21,0.06)',
      boxShadow:'0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
      display:'flex', alignItems:'center', gap: 12, minHeight: 82,
    }}>
      <div style={{position:'relative', flexShrink: 0}}>
        <div style={{
          width: 52, height: 52, borderRadius:'50%',
          background: m.soft, boxShadow:`inset 0 0 0 2px ${m.accent}55`,
          display:'grid', placeItems:'center',
        }}>
          <div style={{textAlign:'center', lineHeight: 1}}>
            <div style={{fontSize: 8.5, fontWeight: 800, letterSpacing:'0.08em', color: m.accent, marginBottom: 2}}>TAV</div>
            <div style={{fontSize: 20, fontWeight: 800, color:'#0F1115'}}>{t.id}</div>
          </div>
        </div>
        {urgent(t) && <span style={{position:'absolute', top: -2, right: -2, width: 13, height: 13, borderRadius:'50%', background:'#DC2626', boxShadow:'0 0 0 2px #fff'}}/>}
      </div>
      <div style={{flex: 1, minWidth: 0}}>
        <div style={{display:'flex', alignItems:'baseline', gap: 6}}>
          <span style={{fontSize: 14.5, fontWeight: 800, color: m.accent}}>{m.label}</span>
          {t.state==='occupato' && <span style={{fontSize: 12, color:'#9CA3AF'}}>· {t.sittingMin}'</span>}
        </div>
        <div style={{fontSize: 13, color:'#6B7280', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop: 2}}>
          {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}{infoText(t)}
        </div>
      </div>
      <div style={{fontSize: 15, fontWeight: 800, fontVariantNumeric:'tabular-nums', flexShrink: 0}}>{seats(t)}<span style={{fontSize: 11, color:'#9CA3AF', fontWeight: 600}}>p</span></div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 7 · COSTA COLORATA — dorso verticale con etichetta, corpo bianco
// ═══════════════════════════════════════════════════════════════
function V7({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      background:'#fff', borderRadius: 14, overflow:'hidden', minHeight: 110,
      border:'1px solid rgba(15,17,21,0.07)',
      boxShadow:'0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
      display:'flex',
    }}>
      <div style={{
        width: 34, flexShrink: 0, background: m.soft,
        borderRight:`1px solid ${m.ring}`,
        display:'flex', alignItems:'center', justifyContent:'center',
      }}>
        <span style={{
          writingMode:'vertical-rl', transform:'rotate(180deg)',
          fontSize: 10.5, fontWeight: 800, letterSpacing:'0.16em', textTransform:'uppercase',
          color: m.accent, whiteSpace:'nowrap',
        }}>{m.label}</span>
      </div>
      <div style={{flex: 1, minWidth: 0, padding:'11px 14px', display:'flex', flexDirection:'column', gap: 4}}>
        <div style={{display:'flex', alignItems:'center', gap: 8}}>
          <span style={{fontSize: 18, fontWeight: 800, letterSpacing:'-0.02em'}}>Tavolo {t.id}</span>
          {urgent(t) && <span style={{fontSize: 11, fontWeight: 800, color:'#fff', background:'#DC2626', padding:'2px 8px', borderRadius: 999}}>+20'</span>}
          <span style={{flex: 1}}/>
          <span style={{fontSize: 14, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)}<span style={{fontSize: 11, color:'#9CA3AF', fontWeight: 600}}>p</span></span>
        </div>
        <div style={{fontSize: 13, color:'#4B5563', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
          {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}{infoText(t)}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 8 · CRONOMETRO — la barra del tempo è la protagonista
// ═══════════════════════════════════════════════════════════════
function V8({ t }) {
  const m = META[t.state];
  // Percentuale barra: occupato → tempo su 90' target · prenotato → avvicinamento arrivo · dapulire → 20' soglia
  let pct = 0, barColor = m.accent, timeLabel = '';
  if (t.state === 'occupato')  { pct = Math.min(100, (t.sittingMin / 90) * 100); timeLabel = `${t.sittingMin}' al tavolo`; barColor = t.sittingMin > 60 ? '#D97706' : '#E32459'; }
  if (t.state === 'prenotato') { pct = isLate(t) ? 100 : Math.max(8, 100 - (t.minAlla / 60) * 100); timeLabel = isLate(t) ? `ritardo ${lateMin(t)}'` : `arriva fra ${t.minAlla}'`; barColor = isLate(t) ? '#DC2626' : '#6D28D9'; }
  if (t.state === 'dapulire')  { pct = Math.min(100, (t.minutiDaPulire / 20) * 100); timeLabel = `liberato ${t.minutiDaPulire}' fa`; barColor = urgent(t) ? '#DC2626' : '#B45309'; }
  if (t.state === 'libero')    { pct = 0; timeLabel = t.res ? `prossima ${t.res.time}` : 'disponibile'; }
  return (
    <div style={{
      background:'#fff', borderRadius: 14, padding:'13px 15px 11px', minHeight: 104,
      border:'1px solid rgba(15,17,21,0.07)',
      boxShadow:'0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
      display:'flex', flexDirection:'column', gap: 5,
    }}>
      <div style={{display:'flex', alignItems:'baseline', gap: 8}}>
        <span style={{fontSize: 17.5, fontWeight: 800, letterSpacing:'-0.02em'}}>Tav. {t.id}</span>
        <span style={{fontSize: 11.5, fontWeight: 800, textTransform:'uppercase', letterSpacing:'0.07em', color: m.accent}}>{m.label}</span>
        <span style={{flex: 1}}/>
        <span style={{fontSize: 13.5, fontWeight: 800, fontVariantNumeric:'tabular-nums'}}>{seats(t)}p</span>
      </div>
      <div style={{fontSize: 13, color:'#6B7280', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
        {t.allergia && <strong style={{color:'#DC2626'}}>Allergia · </strong>}
        {(t.state==='prenotato'||t.state==='libero') && t.res && t.res.name ? `${t.res.time} ${t.res.name}` : (t.alert || ' ')}
      </div>
      <div style={{marginTop:'auto'}}>
        <div style={{display:'flex', justifyContent:'space-between', marginBottom: 4}}>
          <span style={{fontSize: 11.5, fontWeight: 700, color: barColor, fontVariantNumeric:'tabular-nums'}}>{timeLabel}</span>
        </div>
        <div style={{height: 4, borderRadius: 999, background:'rgba(15,17,21,0.07)', overflow:'hidden'}}>
          <div style={{width:`${pct}%`, height:'100%', borderRadius: 999, background: barColor, transition:'width .3s'}}/>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 9 · QUADRANTE — mini-bento: 4 celle dati con divisori hairline
// ═══════════════════════════════════════════════════════════════
function V9({ t }) {
  const m = META[t.state];
  const Cell = ({ k, v, color }) => (
    <div style={{padding:'8px 12px', minWidth: 0}}>
      <div style={{fontSize: 9.5, fontWeight: 800, letterSpacing:'0.1em', textTransform:'uppercase', color:'#9CA3AF', marginBottom: 3}}>{k}</div>
      <div style={{fontSize: 14, fontWeight: 700, color: color || '#0F1115', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{v}</div>
    </div>
  );
  return (
    <div style={{
      background:'#fff', borderRadius: 14, overflow:'hidden',
      border:'1px solid rgba(15,17,21,0.08)',
      boxShadow:'0 1px 0 rgba(15,17,21,0.03), 0 5px 14px rgba(15,17,21,0.05)',
    }}>
      <div style={{padding:'10px 12px 8px', display:'flex', alignItems:'center', gap: 8, borderBottom:'1px solid rgba(15,17,21,0.07)'}}>
        <span style={{width: 8, height: 8, borderRadius:'50%', background: m.accent, boxShadow:`0 0 0 3px ${m.tint}`}}/>
        <span style={{fontSize: 17, fontWeight: 800, letterSpacing:'-0.02em'}}>Tavolo {t.id}</span>
        {urgent(t) && <span style={{fontSize: 10.5, fontWeight: 800, color:'#DC2626'}}>⚠ +20'</span>}
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr'}}>
        <div style={{borderRight:'1px solid rgba(15,17,21,0.06)', borderBottom:'1px solid rgba(15,17,21,0.06)'}}>
          <Cell k="Stato" v={m.label} color={m.accent}/>
        </div>
        <div style={{borderBottom:'1px solid rgba(15,17,21,0.06)'}}>
          <Cell k="Coperti" v={`${seats(t)} / ${t.posti || seats(t)}`}/>
        </div>
        <div style={{borderRight:'1px solid rgba(15,17,21,0.06)'}}>
          <Cell k={t.state==='occupato' ? 'Al tavolo' : 'Ora'} v={t.state==='occupato' ? `${t.sittingMin}'` : (t.res ? t.res.time : '—')}/>
        </div>
        <Cell k="Nota"
          v={t.allergia ? 'Allergia' : (t.alert ? t.alert : (isLate(t) ? `Ritardo ${lateMin(t)}'` : (t.res && t.res.name) || '—'))}
          color={t.allergia ? '#DC2626' : (t.alert || isLate(t) ? '#B45309' : undefined)}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 10 · MANIFESTO — brutalist bold: bordo netto, blocco stato pieno
// ═══════════════════════════════════════════════════════════════
function V10({ t }) {
  const m = META[t.state];
  return (
    <div style={{
      background:'#fff', border:'2px solid #0F1115', borderRadius: 10,
      boxShadow:'4px 4px 0 #0F1115', minHeight: 122,
      display:'flex', flexDirection:'column', overflow:'hidden',
    }}>
      <div style={{display:'flex', alignItems:'stretch', borderBottom:'2px solid #0F1115'}}>
        <div style={{padding:'8px 12px', fontSize: 19, fontWeight: 800, letterSpacing:'-0.02em', flex: 1}}>
          TAV.{t.id}
        </div>
        <div style={{
          padding:'8px 12px', background: m.accent, color:'#fff',
          fontSize: 12, fontWeight: 800, letterSpacing:'0.08em', textTransform:'uppercase',
          display:'flex', alignItems:'center', borderLeft:'2px solid #0F1115',
        }}>{m.label}</div>
      </div>
      <div style={{padding:'10px 12px', fontSize: 13.5, fontWeight: 600, color:'#374151', flex: 1}}>
        {t.allergia && <div style={{color:'#DC2626', fontWeight: 800, textTransform:'uppercase', fontSize: 12}}>Allergia</div>}
        <div style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{infoText(t)}</div>
      </div>
      <div style={{padding:'7px 12px', borderTop:'1.5px dashed #C9CDD4', display:'flex', fontSize: 12.5, fontWeight: 800}}>
        <span>{seats(t)} COPERTI</span>
        <span style={{marginLeft:'auto', color: urgent(t) ? '#DC2626' : '#9CA3AF'}}>{urgent(t) ? '⚠ OLTRE 20 MIN' : (t.state==='occupato' ? `${t.sittingMin} MIN` : '')}</span>
      </div>
    </div>
  );
}
