<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="pn-device.js?v=3"></script>
<title>byup — Onboarding Ristoratore</title>
<link rel="icon" type="image/png" href="/assets/byup-icon.png?v=2"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-byup.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<!-- Fredoka: serve al mockup telefono (titoli categoria 1:1 con l'app) -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    /* Canvas allineato al resto del gestionale: stacca il frame dallo sfondo,
       che con #FAFBFC su #FAFBFC risultava invisibile. */
    background: #ECEEF1;
    color: #1A1D24;
    -webkit-font-smoothing: antialiased;
    /* Centra il frame: zoom proporzionale via JS (fondo pagina) */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    width: 1440px;
    height: 900px;                   /* canvas fisso come le altre schermate: abilita lo zoom-fit */
    margin: 24px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  /* Stage controls: aiuto-demo per navigare tra step. Posizione bottom-right,
     molto neutro, sotto la soglia di attenzione. */
  .stage-controls {
    /* Top-right: ora che ogni step riempie il canvas, il bordo inferiore è
       occupato dalle CTA su tutti e quattro. L'unica zona libera in comune è
       la parte destra dell'header (che ha lì solo uno spacer). */
    position: fixed; top: 16px; right: 16px;
    background: rgba(15, 17, 21, 0.92);
    color: #fff; padding: 6px 10px; border-radius: 8px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    z-index: 100; box-shadow: 0 8px 24px rgba(15, 17, 21, 0.08);
  }
  .stage-controls button {
    background: rgba(255,255,255,0.10); color: #fff;
    border: none; width: 22px; height: 22px;
    border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    transition: background 150ms ease-out;
  }
  .stage-controls button:hover:not(:disabled) {
    background: rgba(255,255,255,0.18);
  }
  .stage-controls button:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Step-stage entrance: dissoluzione + scale-up leggero del contenuto
     sottostante quando l'overlay processing si chiude. Riavvia ad ogni
     cambio step grazie al key={step} in OnboardingApp.
     Vive nel CSS dell'HTML (non dentro un componente che potrebbe
     smontarsi) per non legare la sua disponibilità alla presenza del banner. */
  @keyframes step-stage-enter {
    from { opacity: 0; transform: scale(0.985); }
    to   { opacity: 1; transform: scale(1); }
  }
  .step-stage {
    animation: step-stage-enter 320ms ease-out;
    transform-origin: center top;
    /* Riempie l'altezza residua del frame sotto l'header. Se un singolo step
       eccede il canvas, scrolla al suo interno invece di sfondare il frame. */
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #FAFBFC;
  }
  .step-stage::-webkit-scrollbar { width: 8px; }
  .step-stage::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .step-stage::-webkit-scrollbar-track { background: transparent; }
  /* Feedback di pressione: ogni bottone si comprime leggermente al click */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!--
  Ordine di caricamento intenzionale:
  1. icons (token + icone — usato da tutti)
  2. step1 (definisce primitive comuni: PrimaryCta/SecondaryCta/OnbField/OnbCard/OnbSectionHeader)
  3. step2/3/4 (consumano le primitive)
  4. app (orchestratore — montato per ultimo)
-->
<script type="text/babel" src="onboarding-icons.jsx"></script>
<script type="text/babel" src="panoramica-sf-icons.jsx"></script>
<script type="text/babel" src="byup-glass.jsx"></script>
<script type="text/babel" src="onboarding-step1-upload.jsx"></script>
<script type="text/babel" src="onboarding-step2-locale.jsx?v=6"></script>
<script type="text/babel" src="onboarding-step3-sale-tavoli.jsx"></script>
<script type="text/babel" src="onboarding-step4-verifica.jsx"></script>
<script type="text/babel" src="onboarding-app.jsx?v=3"></script>
<script type="text/babel" src="pn-tooltip.jsx"></script>

<!-- Zoom proporzionale: identico alle altre schermate del gestionale, così
     l'onboarding non appare rimpicciolito rispetto al resto dell'app. -->
<script>
(function () {
  var DESIGN_H = 900, MARGIN = 24, MIN_W = 1280;
  var cur = { frame: null, zoom: null, width: null };
  function fit() {
    var frame = document.querySelector('.frame');
    if (!frame) return;
    // Layout nativo (telefono/tablet adattato): lo zoom si mette da parte
    // e pulisce quel che aveva scritto — comanda il CSS di pn-device.
    if (document.documentElement.hasAttribute('data-pn-native')) {
      if (cur.zoom !== null) { frame.style.zoom = ''; frame.style.width = ''; cur = { frame: null, zoom: null, width: null }; }
      return;
    }
    var s = (window.innerHeight - MARGIN) / DESIGN_H;
    s = Math.max(0.4, Math.min(2.2, s));
    var w = Math.max(MIN_W, (window.innerWidth - MARGIN) / s);
    if (frame !== cur.frame || s !== cur.zoom) frame.style.zoom = s;
    if (frame !== cur.frame || w !== cur.width) frame.style.width = w + 'px';
    cur = { frame: frame, zoom: s, width: w };
  }
  window.addEventListener('resize', fit);
  // Il frame lo monta React dopo la compilazione Babel (async, da CDN):
  // l'observer applica il fit appena compare, e a ogni remount.
  new MutationObserver(fit).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
  fit();
})();
</script>
</body>
</html>
