<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #ECEEF1;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    /* Centra il frame: zoom proporzionale via JS (fondo pagina) */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    width: 1440px;
    height: 900px;
    margin: 24px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-shrink: 0;
  }
  .pn-scroll::-webkit-scrollbar { width: 8px; height:8px; }
  .pn-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .pn-scroll::-webkit-scrollbar-track { background: transparent; }
  input, textarea, select { font-family: inherit; }
  /* Toast e popup: dissolvenza + pop elastico */
  @keyframes toastIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes impOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes impPopIn {
    0% { opacity: 0; transform: scale(0.92) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  /* Scheletro disegnato dal browser prima che React esista. Babel compila una
     quindicina di file e per qualche istante la pagina resterebbe bianca:
     questa è la stessa forma che sta per arrivare — i due menù a sinistra,
     contenuto a destra — così l'attesa somiglia al risultato invece che a
     niente. Le larghezze sono quelle con cui la pagina si aprirà davvero:
     il menù del gestionale arriva com'era nella schermata di prima (la classe
     la mette lo script qui sotto), e si stringe dopo, quando React c'è.
     Senza, allo scoccare del mount la colonna saltava di 200px. */
  .imp-boot { position:absolute; inset:0; display:flex; background:#F7F8FA; }
  .imp-boot-nav { width:68px; flex-shrink:0;
                  background:linear-gradient(180deg, rgba(250,251,252,0.85) 0%, rgba(245,245,247,0.85) 100%);
                  border-right:1px solid rgba(15,17,21,0.06); }
  .imp-boot-sez { width:272px; flex-shrink:0;
                  background:linear-gradient(180deg, rgba(250,251,252,0.85) 0%, rgba(245,245,247,0.85) 100%);
                  border-right:1px solid rgba(15,17,21,0.06); }
  .gest-largo .imp-boot-nav { width:272px; }
  .gest-largo .imp-boot-sez { width:68px; }
  .imp-boot-main { flex:1; display:flex; align-items:center;
                   justify-content:center; color:#9CA3AF; font-size:15px; font-weight:600; }
  .imp-boot-main span { animation: impBootFade 1.4s ease-in-out infinite; }
  @keyframes impBootFade { 0%,100% { opacity:0.35; } 50% { opacity:0.85; } }
  /* Feedback di pressione: ogni bottone si comprime leggermente al click */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>
<script>
  /* Com'era il menù del gestionale nella schermata da cui arrivi: lo scheletro
     lo disegna della stessa larghezza, così il primo fotogramma di React non
     sposta niente. */
  try { if (localStorage.getItem('pn_sidebar_collapsed') !== '1') document.documentElement.classList.add('gest-largo'); } catch (e) {}
</script>
</head>
<body>
<div id="root"><div class="frame"><div class="imp-boot"><div class="imp-boot-nav"></div><div class="imp-boot-sez"></div><div class="imp-boot-main"><span>Impostazioni…</span></div></div></div></div>

<!-- Niente assistente fluttuante qui: in basso a destra c'è già la CTA di
     salvataggio, e il bollino le si siederebbe sopra. -->

<!-- Zoom proporzionale: scala l'intero gestionale in base alla finestra del desktop -->
<script>
(function () {
  var DESIGN_H = 900, MARGIN = 24, MIN_W = 1280;
  // Zoom guidato dall'altezza: tutta la UI scala in proporzione al desktop.
  // Larghezza fluida: dopo lo zoom il frame riempie la larghezza disponibile.
  var cur = { frame: null, zoom: null, width: null };
  function fit() {
    var frame = document.querySelector('.frame');
    if (!frame) return;
    // Layout nativo (telefono/tablet adattato): lo zoom si mette da parte
    // e pulisce quel che aveva scritto — comanda il CSS di pn-device.
    if (document.documentElement.hasAttribute('data-pn-native')) {
      if (cur.zoom !== null) { frame.style.zoom = ''; frame.style.width = ''; cur = { frame: null, zoom: null, width: null }; }
      return;
    }
    var s = (window.innerHeight - MARGIN) / DESIGN_H;
    s = Math.max(0.4, Math.min(2.2, s));
    var w = Math.max(MIN_W, (window.innerWidth - MARGIN) / s);
    if (frame !== cur.frame || s !== cur.zoom) frame.style.zoom = s;
    if (frame !== cur.frame || w !== cur.width) frame.style.width = w + 'px';
    cur = { frame: frame, zoom: s, width: w };
  }
  window.addEventListener('resize', fit);
  // Il frame lo monta React dopo la compilazione Babel (async, da CDN): al
  // primo load può non esistere ancora e i retry a tempo fisso perdevano la
  // gara su rete lenta. L'observer applica il fit appena il frame compare
  // (e su ogni remount): adattamento al primo colpo, senza refresh.
  new MutationObserver(fit).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
  fit();
})();
</script>
</body>
