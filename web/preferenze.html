<!-- ════════════════════════════════════════════════════════════════════
     IL CENTRO DELLE PREFERENZE (P-193 · D-153).

     È la pagina che si apre dal collegamento «Disiscriviti» in fondo alle
     email e dal rimando degli SMS. Non chiede di accedere: chi ci arriva ha
     in mano un collegamento firmato che vale per il suo recapito, e
     obbligarlo a ricordare una password per smettere di ricevere posta
     sarebbe un modo educato di non farlo smettere.

     Pochi interruttori, in italiano, e nessuna parola di mestiere: che cosa
     riceve (novità, promozioni), su quale canale, e quanto spesso. In fondo,
     bene in vista e non nascosto in una riga di testo, «non voglio più
     ricevere niente»: è la richiesta più frequente, e deve costare un tocco.

     Salvare qui scrive il consenso del contatto; il rifiuto totale lo porta
     nel registro dei recapiti soppressi (Hubble → Impostazioni → Recapiti e
     domini di invio → Recapiti soppressi), da dove non si esce a mano.
     Nel prototipo non c'è un server: la scelta resta nel browser.
     ════════════════════════════════════════════════════════════════════ -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    background: #FAF7F5; color: #1B1B1F; padding: 0;

  .sotto { font-size: 15px; color: #6B6B73; line-height: 1.5; margin: 0 0 24px; }
  .recapito { font-weight: 700; color: #1B1B1F; }
  .card { background: #fff; border: 1px solid #ECE6E2; border-radius: 16px; padding: 4px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #8A8A90; margin: 18px 0 6px; }
  .riga { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid #F2EDE9; }

  .sw { position: relative; width: 50px; height: 30px; flex-shrink: 0; border: none; border-radius: 999px;
        background: #D9D4D0; cursor: pointer; transition: background .16s; padding: 0; }
  .sw[aria-checked="true"] { background: #C2185B; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;

  .sw[aria-checked="true"] i { left: 23px; }
  .freq { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 16px; }
  .freq button { font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 9px 15px; border-radius: 999px;
                 border: 1.5px solid #E4DED9; background: #fff; color: #1B1B1F; cursor: pointer; }
  .freq button[aria-pressed="true"] { border-color: #C2185B; background: #FCEFF4; color: #A0134A; }
  .salva { width: 100%; padding: 15px; border: none; border-radius: 999px; background: #1B1B1F; color: #fff;
           font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .salva[disabled] { background: #2E7D4F; }
  .stop { width: 100%; margin-top: 12px; padding: 15px; border-radius: 999px; background: #fff;
          border: 1.5px solid #E7B4B4; color: #B3261E; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .stop[aria-pressed="true"] { background: #FDECEA; }
  .esito { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #EAF6EE; color: #1E5B37;
           font-size: 14.5px; line-height: 1.5; }
  .piede { font-size: 13px; color: #8A8A90; line-height: 1.6; margin-top: 26px; text-align: center; }
