<!doctype html>
<html lang="it">
<head>
<link rel="icon" type="image/png" href="/assets/byup-icon.png"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-byup.png"/>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="byup"/>
<meta name="theme-color" content="#ffffff"/>
<!-- ════════════════════════════════════════════════════════════════════
     ENTRY POINT UNICO della WebApp consumer.
     Tutto vive qui: niente Home, niente login, niente pagine separate
     (i vecchi "byup Home.html" / "byup Menu.html" sono stati rimossi).

     Si arriva a questo file in DUE modi, e solo due:
       1. SCAN QR del TAVOLO — senza installare l'app: si ordina al tavolo.
       2. LINK CONDIVISO (es. su WhatsApp) che apre lo stesso index.html.

     Caso a parte: il QR del MENU D'ASPORTO (?takeaway=1) NON fa ordinare dal
     browser → mostra una schermata che porta a scaricare l'app (l'asporto è
     solo nell'app, dove si paga in anticipo). Vedi Contesto-WebApp.md §2.2.

     Non esistono altri ingressi: niente discovery, niente navigazione
     "byup" dal web. Vedi Contesto-WebApp.md §4.1.
     ════════════════════════════════════════════════════════════════════ -->
<title>byup — Menu</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  @media (max-width: 768px) { .byup-screen-nav { display: none !important; } }
  .hscroll::-webkit-scrollbar { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  button:active { opacity: 0.85; }

  /* ── Gate desktop: sopra i 900px l'esperienza mobile sparisce e
       compare un invito a passare allo smartphone. ── */
  #desktop-gate { display: none; }
  @keyframes byupFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  /* Gate quando ENTRAMBE le dimensioni ≥ 600px → ovvero il lato corto ≥ 600px:
     vale per tablet (iPad mini 768, iPad Pro 834) e desktop. I telefoni, anche
     in orizzontale, hanno il lato corto ≤ ~430px → non vengono mai bloccati. */
  @media (min-width: 600px) and (min-height: 600px) {
    #menu-root { display: none !important; }
    #desktop-gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: fixed; inset: 0; padding: 40px;
      text-align: center; background: linear-gradient(160deg, #fff 0%, #faf6ee 100%);
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    }
    #desktop-gate .dg-art { width: 180px; height: 180px; margin-bottom: 36px; animation: byupFloat 3.6s ease-in-out infinite; }
    #desktop-gate h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; color: #1a1a1a; margin: 0 0 16px; max-width: 560px; line-height: 1.2; }
    #desktop-gate p { font-size: 17px; font-weight: 500; color: #6b6258; margin: 0; max-width: 460px; line-height: 1.5; }
  }
</style>
</head>
<body>
<a id="byup-hub-btn" href="/" aria-label="Torna alla home byup">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
  <span>Home byup</span>
</a>
<style>
#byup-hub-btn{position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:9px 14px 9px 11px;font:600 13px/1 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:#fff;text-decoration:none;background:rgba(20,20,24,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);transition:transform .18s ease,background .18s ease}
#byup-hub-btn:hover{background:rgba(20,20,24,.92);transform:translateY(-2px)}
#byup-hub-btn svg{flex:none}
@media print{#byup-hub-btn{display:none}}
</style>

<div id="desktop-gate">
  <svg class="dg-art" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- corpo dello smartphone -->
    <rect x="34" y="14" width="52" height="92" rx="13" fill="#1a1a1a"/>
    <rect x="38" y="22" width="44" height="76" rx="7" fill="#faf6ee"/>
    <!-- speaker + tasto home -->
    <rect x="52" y="17.5" width="16" height="2.5" rx="1.25" fill="#444"/>
    <circle cx="60" cy="102" r="3" fill="#444"/>
    <!-- faccina: occhi (uno fa l'occhiolino) -->
    <circle cx="51" cy="50" r="3.6" fill="#1a1a1a"/>
    <path d="M64 50 q4.5 -4 9 0" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
    <!-- guance -->
    <circle cx="48" cy="62" r="3.4" fill="#ffb3a1" opacity="0.7"/>
    <circle cx="72" cy="62" r="3.4" fill="#ffb3a1" opacity="0.7"/>
    <!-- sorriso -->
    <path d="M50 64 q10 12 20 0" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <!-- braccino che saluta -->
    <path d="M86 46 q14 -6 13 -20" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="25" r="5" fill="#1a1a1a"/>
  </svg>
  <h1>Questa funzionalità è pensata per dispositivi mobile</h1>
  <p>Passa al telefono per goderti l'esperienza così come è stata pensata. 📱</p>
</div>
<div id="menu-root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Leaflet: mappa "Dove siamo" nella vetrina del locale -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- api.jsx: layer di accesso al backend (window.ByupAPI), oggi mock.
     dish-art.jsx: disegni dei piatti (window.DishArt).
     venue.jsx: vetrina del locale (window.VenueScreen).
     menu.jsx: cuore della webapp, monta Root su #menu-root. -->
<script type="text/babel" src="api.jsx"></script>
<script type="text/babel" src="dish-art.jsx"></script>
<script type="text/babel" src="venue.jsx"></script>
<script type="text/babel" src="menu.jsx"></script>

<!-- ── Mockup iPhone da desktop ─────────────────────────────────────────
     Da browser desktop (puntatore fine, niente touch) la webapp non va a
     tutto schermo: si visiona dentro una cornice iPhone a dimensioni REALI
     (1:1), completamente utilizzabile, con selettore del modello — come la
     preview della web cameriere. L'iframe ha la width vera del telefono,
     quindi il gate dei 600px non scatta e le media query reagiscono come
     su un device vero. I query param (?takeaway, ?os, …) e l'hash vengono
     inoltrati all'iframe: ogni link di test resta valido.
     Telefoni e tablet veri (touch) non cambiano: telefono → app piena,
     tablet → gate CSS "passa al telefono" come prima. -->
<script>
(function () {
  if (window.self !== window.top) {
    // Dentro un iframe (mockup o simulator.html): app nuda, mai mockup
    // annidato; il bottone "Home byup" resta solo sulla pagina esterna.
    var hub = document.getElementById('byup-hub-btn');
    if (hub) hub.style.setProperty('display', 'none', 'important');
    return;
  }
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (coarse && (navigator.maxTouchPoints || 0) > 0) return; // dispositivo touch reale

  // Spengo l'app top-level PRIMA che Babel la compili (girerebbe nascosta
  // e sporcherebbe la sessionStorage, condivisa con l'iframe) e il gate CSS.
  document.querySelectorAll('script[type="text/babel"]').forEach(function (s) { s.type = 'text/plain'; });
  var gate = document.getElementById('desktop-gate');
  if (gate) gate.style.setProperty('display', 'none', 'important');
  var rootEl = document.getElementById('menu-root');
  if (rootEl) rootEl.style.setProperty('display', 'none', 'important');

  var IPHONES = [
    { label: 'iPhone SE',         w: 375, h: 667 },
    { label: 'iPhone 14',         w: 390, h: 844 },
    { label: 'iPhone 15 Pro',     w: 393, h: 852 },
    { label: 'iPhone 14 Pro Max', w: 430, h: 932 },
  ];
  var current = IPHONES[1]; // default: iPhone 14

  var stage = document.createElement('div');
  stage.style.cssText = 'position:fixed;inset:0;z-index:9000;background:#1a1a1f;overflow:auto;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:40px;padding:40px 24px;';

  // pannello informativo + selettore modello
  var info = document.createElement('div');
  info.style.cssText = 'max-width:320px;padding-top:24px;flex-shrink:0;';
  info.innerHTML =
    '<div style="width:56px;height:56px;border-radius:16px;margin-bottom:20px;background:#FFE0DD;display:flex;align-items:center;justify-content:center;">' +
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F26B7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><line x1="11" y1="18" x2="13" y2="18"/></svg>' +
    '</div>' +
    '<div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-0.4px;">Pensata per lo smartphone</div>' +
    '<div style="font-size:14.5px;line-height:1.55;color:rgba(255,255,255,0.6);font-weight:500;margin-bottom:24px;">La webapp cliente è pensata per il telefono. Da desktop la provi qui, dentro una cornice iPhone a dimensioni reali: tutto è utilizzabile come dal vivo. Scegli il modello per testare le diverse dimensioni.</div>';
  var pills = document.createElement('div');
  pills.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
  info.appendChild(pills);
  var caption = document.createElement('div');
  caption.style.cssText = 'margin-top:16px;font-size:12.5px;color:rgba(255,255,255,0.45);font-weight:600;';
  info.appendChild(caption);

  // cornice iPhone con la webapp dentro
  var frame = document.createElement('div');
  frame.style.cssText = 'flex-shrink:0;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,0.45),0 0 0 11px #111,0 0 0 12px rgba(255,255,255,0.08);';
  var iframe = document.createElement('iframe');
  iframe.src = 'index.html' + location.search + location.hash;
  iframe.style.cssText = 'border:0;display:block;background:#fff;';
  frame.appendChild(iframe);

  function apply() {
    frame.style.width = current.w + 'px';
    frame.style.height = current.h + 'px';
    iframe.style.width = current.w + 'px';
    iframe.style.height = current.h + 'px';
    caption.textContent = current.label + ' · ' + current.w + '×' + current.h + ' · scala 1:1';
    Array.prototype.forEach.call(pills.children, function (b, i) {
      var on = IPHONES[i] === current;
      b.style.background = on ? '#fff' : 'transparent';
      b.style.color = on ? '#0F1115' : 'rgba(255,255,255,0.8)';
      b.style.borderColor = on ? 'transparent' : 'rgba(255,255,255,0.25)';
    });
  }

  IPHONES.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.style.cssText = 'padding:8px 14px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,0.25);background:transparent;color:rgba(255,255,255,0.8);font-family:inherit;font-size:12.5px;font-weight:700;';
    b.onclick = function () { current = d; apply(); };
    pills.appendChild(b);
  });

  stage.appendChild(info);
  stage.appendChild(frame);
  document.body.appendChild(stage);
  apply();
})();
</script>
</body>
</html>
