<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #ECEEF1;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'ss01', 'cv11';
    letter-spacing: -0.005em;
  }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(60,60,67,0.18); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(60,60,67,0.32); background-clip: padding-box; border: 2px solid transparent; }
  input, textarea, select, button { font-family: inherit; }
  /* Frame desktop 1440×900 — zoomata proporzionalmente alla finestra (script a
     fondo pagina), come il gestionale: la UI scala con lo schermo, non resta a 1:1. */
  .frame {
    width: 1440px; height: 900px;
    margin: 24px auto;
    background: #FAFAFB;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-shrink: 0;
  }

  /* Apple-style focus ring */
  *:focus { outline: none; }
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible,
  input:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-visible {
    outline: 3px solid rgba(255,90,95,0.35);
    outline-offset: 1px;
    border-radius: 8px;
    transition: outline-offset 0.12s ease;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: none;
    border-color: #FF5A5F !important;
    box-shadow: 0 0 0 4px rgba(255,90,95,0.18) !important;
  }

  /* Selection */
  ::selection { background: rgba(255,90,95,0.20); color: #0F1115; }

  /* Tab button — Apple segmented control feel */
  .adm-tab-btn {
    transition: background 0.18s ease, color 0.18s ease, transform 0.15s cubic-bezier(0.34,1.56,0.64,1) !important;
  }
  .adm-tab-btn:hover:not(.is-active) {
    background: rgba(0,0,0,0.035) !important;
    color: #0F1115 !important;
  }
  .adm-tab-btn:active { transform: scale(0.96); }
  .adm-tab-btn.is-active {
    box-shadow: 0 -1px 0 rgba(255,90,95,0.0) inset, 0 2px 12px -4px rgba(255,90,95,0.18);
  }

  /* Apple-style button micro-interactions */
  .adm-btn {
    transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease, background 0.15s ease, border-color 0.15s ease !important;
    position: relative;
  }
  .adm-btn:not(:disabled):hover { transform: translateY(-0.5px); }
  .adm-btn:not(:disabled):active { transform: translateY(0) scale(0.97); transition-duration: 0.05s !important; }
  .adm-btn-primary:not(:disabled):hover { box-shadow: 0 6px 18px -6px rgba(15,17,21,0.35), 0 1px 0 rgba(255,255,255,0.08) inset !important; }
  .adm-btn-secondary:not(:disabled):hover { background: #FBFBFC !important; border-color: #D8DADE !important; box-shadow: 0 1px 3px rgba(15,17,21,0.04) !important; }
  .adm-btn-ghost:not(:disabled):hover { background: rgba(0,0,0,0.04) !important; }
  .adm-btn-danger:not(:disabled):hover { box-shadow: 0 6px 18px -6px rgba(220,38,38,0.45) !important; }
  .adm-btn-success:not(:disabled):hover { box-shadow: 0 6px 18px -6px rgba(22,163,74,0.45) !important; }
  .adm-btn-cta:not(:disabled):hover { box-shadow: 0 10px 28px -8px rgba(255,90,95,0.6), 0 1px 0 rgba(255,255,255,0.3) inset !important; }

  /* "Invita membro" — primary CTA con respiro coral idle + "+" che ruota e cresce all'hover */
  .adm-btn-invite { animation: inviteBreath 2.8s ease-in-out infinite; }
  .adm-btn-invite:hover { animation-play-state: paused; }
  .adm-btn-invite svg { transition: transform 0.34s cubic-bezier(0.34,1.56,0.64,1); }
  .adm-btn-invite:not(:disabled):hover svg { transform: rotate(90deg) scale(1.14); }
  @keyframes inviteBreath {
    0%, 100% { box-shadow: 0 1px 2px rgba(15,17,21,0.20), 0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 0 rgba(255,90,95,0); }
    50%      { box-shadow: 0 1px 2px rgba(15,17,21,0.20), 0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 5px rgba(255,90,95,0.18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .adm-btn-invite { animation: none; }
    .adm-btn-invite svg { transition: none; }
  }

  /* Icon button hover refinement */
  .adm-iconbtn { transition: background 0.14s ease, transform 0.12s cubic-bezier(0.34,1.56,0.64,1) !important; }
  .adm-iconbtn:active { transform: scale(0.92); }

  /* Sidebar nav item — Apple sidebar feel */
  .adm-nav-item {
    transition: background 0.14s ease, color 0.14s ease, transform 0.12s cubic-bezier(0.34,1.56,0.64,1) !important;
  }
  .adm-nav-item:hover:not(.is-active) { background: rgba(0,0,0,0.04) !important; }
  .adm-nav-item:active { transform: scale(0.985); }

  /* iOS switch */
  .adm-switch { transition: background 0.22s ease, box-shadow 0.22s ease; }
  .adm-switch-thumb { transition: left 0.26s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s ease, width 0.18s ease; }
  .adm-switch:active .adm-switch-thumb { width: 24px; }

  /* Action queue row (Dashboard · Da fare oggi) */
  .adm-actionrow { transition: background 0.13s ease; }
  .adm-actionrow:hover { background: rgba(0,0,0,0.025); }
  .adm-actionrow:active { background: rgba(0,0,0,0.05); }

  /* Card hover lift */
  /* ═══ Stati di interazione — affordance sistematiche ═══════════════════
     Ogni elemento cliccabile deve dichiararsi in 3 stati: rest (segnale
     visibile: chip/freccia), hover (la superficie risponde: lift + coral),
     active (feedback di pressione). Vale per card, righe e bottoni. */

  /* Pressione: ogni bottone si comprime al click (come nel gestionale) */
  button { transition: transform 90ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }

  /* Card cliccabile: cursore + lift con tinta brand + pressione */
  .adm-card-interactive { cursor: pointer; transition: box-shadow 0.18s ease, transform 0.18s cubic-bezier(0.34,1.2,0.64,1), border-color 0.18s ease; }
  .adm-card-interactive:hover {
    transform: translateY(-2px);
    border-color: #FFB3B5 !important;
    box-shadow: 0 12px 28px -12px rgba(255,90,95,0.28), 0 2px 6px -2px rgba(15,17,21,0.05) !important;
  }
  .adm-card-interactive:active { transform: translateY(0) scale(0.99); }

  /* Chip di apertura: cerchietto con freccia sulle card cliccabili.
     A riposo è grigio tenue; in hover si riempie di coral e scivola → */
  .adm-open-chip {
    width: 24px; height: 24px; border-radius: 50%;
    background: #F1F2F4; color: #8A8A90;
    display: inline-grid; place-items: center; flex-shrink: 0;
    transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
  }
  .adm-card-interactive:hover .adm-open-chip { background: #FF5A5F; color: #fff; transform: translateX(2px); }

  /* Modale centrale — ingresso morbido (dettaglio entità: locali/staff/utenti) */
  @keyframes admModalIn { from { opacity:0; transform: translateY(10px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }

  /* Pill/chip/toggle: hover universale — leggero scurimento di qualunque fondo */
  .adm-pill { transition: filter 0.14s ease, background 0.14s ease, border-color 0.14s ease, color 0.14s ease; }
  .adm-pill:hover { filter: brightness(0.95); }

  /* Link testuali d'azione */
  .adm-textlink { transition: opacity 0.12s ease; }
  .adm-textlink:hover { opacity: 0.65; }

  /* Righe di lista cliccabili: la freccia si accende e scivola in hover */
  .adm-row-chev { transition: color 0.15s ease, transform 0.15s ease; display: inline-flex; }
  .adm-row-open { cursor: pointer; }
  .adm-row-open:hover .adm-row-chev { color: #FF5A5F; transform: translateX(3px); }

  /* Inputs */
  input, textarea, select {
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  /* Tooltip atom */
  [data-tip] { position: relative; }
  [data-tip]:hover::after,
  [data-tip]:focus::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.45;
    white-space: pre-line;
    max-width: 260px;
    width: max-content;
    text-align: left;
    box-shadow: 0 10px 28px -10px rgba(0,0,0,0.35);
    z-index: 100;
    pointer-events: none;
    animation: tipIn 0.16s ease;
  }
  [data-tip]:hover::before,
  [data-tip]:focus::before {
    content: '';
    position: absolute;
    bottom: calc(100% + 2px);
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: rgba(15,17,21,0.92);
    z-index: 100;
    pointer-events: none;
    animation: tipIn 0.16s ease;
  }
  [data-tip-pos="below"]:hover::after,
  [data-tip-pos="below"]:focus::after { bottom: auto; top: calc(100% + 8px); }
  [data-tip-pos="below"]:hover::before,
  [data-tip-pos="below"]:focus::before { bottom: auto; top: calc(100% + 2px); }
  @keyframes tipIn { from { opacity:0; transform: translateX(-50%) translateY(2px);} to { opacity:1; transform: translateX(-50%) translateY(0);} }

  /* CTA Nuovo messaggio — shine + lift */
  .adm-cta-msg { will-change: transform; }
  .adm-cta-msg:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(232,87,128,0.55), 0 1px 0 rgba(255,255,255,0.3) inset !important; }
  .adm-cta-msg:active { transform: translateY(0); }
  .adm-cta-msg__shine {
    position:absolute; top:0; left:-60%; width:50%; height:100%;
    background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
    transform: skewX(-20deg);
    pointer-events:none;
    animation: ctaShine 4.5s ease-in-out infinite;
  }
  @keyframes ctaShine {
    0% { left: -60%; }
    35% { left: 130%; }
    100% { left: 130%; }
  }
  .adm-cta-pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #FF5A5F;
    box-shadow: 0 0 0 0 rgba(255,90,95,0.7);
    animation: ctaPulse 1.8s ease-out infinite;
  }
  @keyframes ctaPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,90,95,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(255,90,95,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,90,95,0); }
  }

  /* ═══════════════════════════════════════════════════════════════════════
     RESPONSIVE — Apple-style
     ─────────────────────────────────────────────────────────────────────
     Strategia: NIENTE optical scaling globale (rompe layout con widths in vw).
     Approccio corretto: cappare la larghezza massima del contenuto, così
     le card e le griglie non si stirano oltre una misura confortevole su
     monitor grandi. La sidebar resta full-height, il main si centra.
     Apple lo fa così in App Store Connect, Mail e Messages.
     ═══════════════════════════════════════════════════════════════════════ */

  /* === Contenuto a piena finestra ===
     Il primo figlio del wrapper-scroll di <main> è il root di ogni pagina:
     occupa sempre il 100% della larghezza disponibile, senza cap. */
  main > div > * {
    max-width: none;
    margin-left: auto !important;
    margin-right: auto !important;
    width: 100%;
  }

  /* === Tablet (760-1199px) ===
     Sidebar più stretta, padding header ridotti, niente cap (non serve). */
  @media (max-width: 1199px) {
    aside[style*="width: 288"] { width: 240px !important; }
    main > header { padding: 14px 22px !important; }
  }

  /* === Mobile (<760px): splash gentile ===
     Un admin con sidebar + lista + dettaglio non si comprime su 375px senza
     un redesign separato. Diciamo all'utente di usare uno schermo più grande. */
  @media (max-width: 759px) {
    body { overflow: auto; }
    #root > div { display: none !important; }
    #root::after {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #FFF1EF 0%, #F5F5F7 100%);
      z-index: 9998;
    }
    #root::before {
      content: 'Byup Spot \A è ottimizzato per tablet, desktop e schermi più grandi. \A \A Per usare la console, apri questa pagina su un dispositivo con almeno 760px di larghezza.';
      white-space: pre-line;
      position: fixed; inset: 0;
      display: grid; place-items: center;
      padding: 32px 24px;
      text-align: center;
      font-family: inherit;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.01em;
      color: #0F1115;
      z-index: 9999;
    }
  }
</style>
</head>

<!-- Zoom proporzionale: scala l'intero Spot in base alla finestra del desktop,
     identico al gestionale (byup Panoramica.html). Guidato dall'altezza; la
     larghezza del frame è fluida per riempire lo spazio disponibile. -->
<script>
(function () {
  var DESIGN_H = 900, MARGIN = 24, MIN_W = 1280;
  var cur = { frame: null, zoom: null, width: null };
  function fit() {
    var frame = document.querySelector('.frame');
    if (!frame) return;
    var s = (window.innerHeight - MARGIN) / DESIGN_H;
    s = Math.max(0.4, Math.min(2.2, s));
    var w = Math.max(MIN_W, (window.innerWidth - MARGIN) / s);
    if (frame !== cur.frame || s !== cur.zoom) frame.style.zoom = s;
    if (frame !== cur.frame || w !== cur.width) frame.style.width = w + 'px';
    cur = { frame: frame, zoom: s, width: w };
  }
  window.addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
  fit();
})();
</script>
