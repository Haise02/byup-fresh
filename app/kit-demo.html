<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>byup — Kit demo</title>
<style>
  html, body { margin:0; padding:0; min-height:100%; }
  *, *::before, *::after { box-sizing:border-box; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="byup-app-kit.jsx"></script>
<script type="text/babel">
const { useState } = React;
const K = window.ByupKit;
const { TYPE, RADII, PALETTE, ASSETS, stagger } = K;

function Row({ label, children }) {
  return (
    <div style={{ marginBottom: 26 }}>
      <div style={{ fontFamily: TYPE.sans, ...TYPE.micro, textTransform:'uppercase', opacity:.5, marginBottom:10 }}>{label}</div>
      {children}
    </div>
  );
}

function Demo() {
  const [T, mode, setMode] = K.useByupTheme();
  const [celebrate, setCelebrate] = useState(false);
  return (
    <K.Atmosphere T={T} style={{ minHeight:'100vh' }}>
      <div style={{ maxWidth: 420, margin:'0 auto', padding:'28px 20px 140px', color:T.text, fontFamily:TYPE.sans }}>

        {/* header */}
        <div style={stagger(0)}>
          <div style={{ fontFamily:TYPE.display, ...TYPE.h1, color:T.text }}>Stasera, Nilo?</div>
          <div style={{ ...TYPE.body, color:T.textDim, marginTop:4 }}>byup app kit — demo tokens & mascotte</div>
        </div>

        {/* theme switch */}
        <div style={{ display:'flex', gap:8, margin:'20px 0 30px', ...stagger(1) }}>
          {['auto','light','dark'].map(m => (
            <button key={m} className="bk-press" onClick={() => setMode(m)} style={{
              fontFamily:TYPE.sans, ...TYPE.small, fontWeight:700, padding:'9px 18px',
              borderRadius:RADII.pill, cursor:'pointer',
              background: mode===m ? T.primary : T.accentSoft,
              color: mode===m ? T.onPrimary : T.primary,
              border:`1px solid ${mode===m ? 'transparent' : T.accentBorder}`,
            }}>{m}</button>
          ))}
        </div>

        <div style={stagger(2)}>
        <Row label="Palette">
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            {Object.entries(PALETTE).map(([k,v]) => (
              <div key={k} style={{ textAlign:'center' }}>
                <div style={{ width:52, height:52, borderRadius:16, background:v, border:`1px solid ${T.line}`, boxShadow:T.shadowSoft }}/>
                <div style={{ ...TYPE.micro, opacity:.55, marginTop:5 }}>{k}</div>
              </div>
            ))}
          </div>
        </Row>
        </div>

        <div style={stagger(3)}>
        <Row label="Type — Fredoka display · Hanken Grotesk body">
          <div style={{ fontFamily:TYPE.display, ...TYPE.h2 }}>Dividi con un tap.</div>
          <div style={{ fontFamily:TYPE.display, ...TYPE.h3, color:T.primary, marginTop:2 }}>€ 24,50</div>
          <div style={{ ...TYPE.body, color:T.textDim, marginTop:6 }}>Il corpo testo usa Hanken Grotesk: leggibile, caldo, per UI e prezzi.</div>
        </Row>
        </div>

        <div style={stagger(4)}>
        <Row label="Card soft-glass">
          <K.GlassPanel T={T} style={{ padding:20 }}>
            <div style={{ display:'flex', alignItems:'center', gap:14 }}>
              <img src={ASSETS.hero.spritz} width="54" alt="" style={{ filter:'drop-shadow(0 8px 12px rgba(77,18,46,.25))' }}/>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:TYPE.display, ...TYPE.title }}>Aperitivo al Duomo</div>
                <div style={{ ...TYPE.small, color:T.textDim, marginTop:2 }}>A 400 m · aperto ora</div>
              </div>
              <span style={{ ...TYPE.micro, color:T.primary, background:T.accentSoft, border:`1px solid ${T.accentBorder}`, padding:'6px 11px', borderRadius:RADII.pill }}>APERTO</span>
            </div>
          </K.GlassPanel>
        </Row>
        </div>

        <div style={stagger(5)}>
        <Row label="Icone categorie (mai emoji)">
          <div style={{ display:'flex', gap:14, overflowX:'auto', paddingBottom:6 }}>
            {Object.entries(ASSETS.cat).slice(0,8).map(([k,src]) => (
              <div key={k} style={{ textAlign:'center', flex:'0 0 auto' }}>
                <div className="bk-press" style={{ width:66, height:66, borderRadius:21, background:T.surface, border:`1px solid ${T.line}`, boxShadow:T.shadowSoft, display:'grid', placeItems:'center', cursor:'pointer' }}
                     onClick={() => K.haptic.selection()}>
                  <img src={src} width="46" alt={k}/>
                </div>
                <div style={{ ...TYPE.micro, opacity:.6, marginTop:5 }}>{k}</div>
              </div>
            ))}
          </div>
        </Row>
        </div>

        <div style={{ display:'flex', gap:10, ...stagger(6) }}>
          <K.PillButton T={T} onClick={() => { K.haptic.success(); setCelebrate(true); setTimeout(()=>setCelebrate(false), 2400); }}>
            Paga €24,50
          </K.PillButton>
          <K.PillButton T={T} variant="ghost" onClick={() => { K.resetFirstVisits(); location.reload(); }}>
            Reset prima visita
          </K.PillButton>
        </div>

        <div style={stagger(7)}>
        <Row label="">
          <div style={{ marginTop:26 }}/>
          <Row label="Mascotte inline — empty state">
            <K.Mascot T={T} pose="sleep" message="Qui ancora niente… ci sto lavorando 👀"/>
          </Row>
        </Row>
        </div>
      </div>

      {/* prima visita: la mascotte entra con spring */}
      <K.MascotMoment
        T={T} pose="wave" pageKey="kit-demo"
        message="Ciao! Sono la mascotte byup. Tocca per mandarmi via."
        coachmark="Prova il toggle del tema"
      />
      {celebrate && (
        <K.MascotMoment T={T} pose="wink" force confetti size={140}
          message="Fatto. Goditi la serata." onDismiss={() => {}}/>
      )}
    </K.Atmosphere>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
