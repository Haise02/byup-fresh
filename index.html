<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>byup — Ecosistema</title>
<meta name="description" content="L'ecosistema byup in un posto: l'app e la webapp per i clienti, il gestionale Fresh, Staff per incasso e sala, la console Desk e Panorama."/>
<meta name="theme-color" content="#FBF4F1"/>
<link rel="icon" type="image/png" href="assets/byup-icon.png?v=2"/>
<link rel="apple-touch-icon" href="assets/apple-touch-byup.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /* Home del prototipo (21 ottobre → 24 ottobre 2026): pagina chiara, i
     marchi veri di ogni prodotto, e dove un prodotto ha più versioni le si
     sceglie dentro la stessa scheda (byup: app o webapp; Staff: incasso o
     cameriere; Desk: 1 o 2.0). Panorama c'è ma non si apre ancora. */
  :root{
    --bg:#FBF4F1; --surf:#FFFFFF; --tint:#F5ECE8; --ink:#1C0F15; --dim:rgba(28,15,21,.60); --faint:rgba(28,15,21,.40); --line:rgba(77,18,46,.09);
    --display:'Fredoka','Hanken Grotesk',system-ui,sans-serif;
    --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.45,.64,1); --ease:cubic-bezier(.22,.9,.35,1);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0 0 auto;height:520px;pointer-events:none;z-index:0;
    background:radial-gradient(60% 70% at 15% 0%,rgba(255,61,110,.13),transparent 70%),radial-gradient(50% 60% at 90% 10%,rgba(170,140,255,.12),transparent 70%)}
  a{color:inherit}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bar img{height:38px;width:auto;display:block}
  .proto{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--surf);font-size:13px;font-weight:700;color:var(--dim);box-shadow:0 6px 16px -12px rgba(77,18,46,.5)}
  .proto i{width:8px;height:8px;border-radius:999px;background:#3DDC7F;box-shadow:0 0 0 3px rgba(61,220,127,.18)}

  .hero{margin:54px 0 30px;max-width:720px}
  .hero h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,5.4vw,58px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
  .hero p{margin:14px 0 0;font-size:17px;line-height:1.5;color:var(--dim);max-width:56ch}

  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
  .card{grid-column:span 4;position:relative;display:flex;flex-direction:column;gap:16px;background:var(--surf);border-radius:30px;padding:24px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 22px 44px -32px rgba(77,18,46,.55);transition:transform .35s var(--spring),box-shadow .35s}
  .card:hover{transform:translateY(-3px);box-shadow:0 30px 56px -34px rgba(77,18,46,.6)}
  .card.w7{grid-column:span 7}.card.w5{grid-column:span 5}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .logo{height:86px;display:flex;align-items:center}
  .logo img{height:100%;width:auto;max-width:100%;display:block;filter:drop-shadow(0 10px 18px rgba(77,18,46,.16))}
  .w7 .logo,.w5 .logo{height:104px}
  .logo.wide{height:64px}
  .aud{flex-shrink:0;height:28px;padding:0 11px;border-radius:999px;background:var(--tint);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:inline-flex;align-items:center;white-space:nowrap}
  .aud.soon{background:#1C0F15;color:#fff}

  .seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--tint);align-self:flex-start;min-width:220px}
  .seg button{position:relative;z-index:1;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;color:var(--dim);transition:color .25s;white-space:nowrap}
  .seg button[aria-selected="true"]{color:var(--ink)}
  .seg .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--surf);box-shadow:0 6px 14px -8px rgba(77,18,46,.5);transition:transform .45s var(--spring),width .3s}

  .desc{margin:0;font-size:15px;line-height:1.5;color:var(--dim);min-height:3em;transition:opacity .2s}
  .w7 .desc,.w5 .desc{font-size:16px}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .go{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;background:var(--c);color:#fff;font-size:15px;font-weight:800;text-decoration:none;
    box-shadow:0 12px 24px -12px var(--c);transition:transform .25s var(--spring),filter .2s}
  .go:hover{filter:brightness(1.06)}
  .go:active{transform:scale(.96)}
  .go svg{width:17px;height:17px;transition:transform .25s var(--spring)}
  .go:hover svg{transform:translateX(3px)}
  .go[aria-disabled="true"]{background:var(--tint);color:var(--faint);box-shadow:none;cursor:default;pointer-events:none}
  .path{font-size:12.5px;font-weight:600;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  .note{margin-top:34px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:13px;color:var(--faint);text-align:center}

  @media (max-width:960px){
    .card,.card.w7,.card.w5{grid-column:span 12}
    .card.half{grid-column:span 6}
  }
  @media (max-width:640px){
    .wrap{padding-top:18px}
    .hero{margin:34px 0 22px}
    .card.half{grid-column:span 12}
    .card{padding:20px;border-radius:26px}
    .logo,.w7 .logo,.w5 .logo{height:72px}
    .logo.wide{height:52px}
    .seg{min-width:0;align-self:stretch}
    .path{display:none}
    .go{width:100%;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <img src="assets/marchi/byup.png" alt="byup"/>
    <span class="proto"><i></i>Prototipo · dati di prova</span>
  </header>

  <section class="hero">
    <h1>Tutto byup, in un posto.</h1>
    <p>Le app per chi mangia, gli strumenti per chi lavora nel locale e la console del team. Scegli la versione da aprire dentro ogni scheda.</p>
  </section>

  <main class="grid" id="grid"></main>

  <p class="note">Ogni schermata è un prototipo: i dati sono finti e servono solo a far vedere come si usa.</p>
</div>

<script>
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
// Un prodotto, una scheda. Dove ci sono più versioni, le sceglie il selettore.
const PRODOTTI = [
  { id:'byup', w:'w7', logo:'byup', aud:'Per i clienti', c:'#FF2159', modi:[
    { k:'App', btn:'Apri l\'app', href:'app/byup%20Home.html',
      desc:'L\'app per chi esce a mangiare: trovi i locali sulla mappa, prenoti un tavolo, ordini dal tavolo, dividi il conto e paghi dal telefono.' },
    { k:'Webapp', btn:'Apri la webapp', href:'web/index.html',
      desc:'Si apre dal QR sul tavolo, senza installare niente: menù, ordine, conto diviso in tempo reale e pagamento. Se chiudi la pagina, l\'ordine si recupera.' } ] },
  { id:'fresh', w:'w5', logo:'fresh', aud:'Per i locali', c:'#FF505B', modi:[
    { btn:'Apri il gestionale', href:'gestionale/byup%20Login.html',
      desc:'Il gestionale del locale: sala e prenotazioni, cucina, menù, conti e incassi, statistiche e impostazioni.' } ] },
  { id:'staff', w:'half', logo:'staff', aud:'Per lo staff', c:'#E84B73', modi:[
    { k:'Incasso', btn:'Apri Staff', href:'staff/index.html',
      desc:'Per incassare al tavolo con il telefono: Tap to Pay su iPhone e Android, pagamenti con carta tramite Stripe Terminal.' },
    { k:'Cameriere', btn:'Apri Cameriere', href:'cameriere/cameriereweb.html',
      desc:'La presa ordini in sala dal palmare: piantina dei tavoli, comande, conto e pagamento.' } ] },
  { id:'desk', w:'half', logo:'desk', aud:'Team byup', c:'#4A2742', modi:[
    { k:'1', btn:'Apri Desk', href:'desk/byup-desk.html',
      desc:'La console interna com\'era al 17 ottobre: il team, i contatti dei locali, gli elenchi, il marketing, i workflow e gli agenti.' },
    { k:'2.0', btn:'Apri Desk 2.0', href:'desk-2/byup-desk.html',
      desc:'La console ridisegnata: la pagina Oggi, Byuppino l\'assistente, Sales per le trattative, le notifiche e i ruoli del team.' } ] },
  { id:'panorama', w:'', logo:'panorama', wide:true, aud:'In arrivo', soon:true, c:'#1C0F15', modi:[
    { btn:'Non ancora disponibile', href:null,
      desc:'Il business manager di byup: i locali selezionati acquistano spazi promozionali in app, dai consigliati agli eventi. Accesso su invito.' } ] },
];
const ricorda = (k, v) => { try { v === undefined ? (v = localStorage.getItem('byup_home_' + k)) : localStorage.setItem('byup_home_' + k, v); } catch (e) { return null; } return v; };

const grid = document.getElementById('grid');
grid.innerHTML = PRODOTTI.map(p => `
  <article class="card ${p.w}" data-id="${p.id}" style="--c:${p.c}">
    <div class="top"><div class="logo ${p.wide ? 'wide' : ''}"><img src="assets/marchi/${p.logo}.png" alt="${p.id}"/></div>
      <span class="aud ${p.soon ? 'soon' : ''}">${p.aud}</span></div>
    ${p.modi.length > 1 ? `<div class="seg" role="tablist" aria-label="Versione">${p.modi.map((m, i) => `<button role="tab" data-i="${i}" aria-selected="false">${m.k}</button>`).join('')}<span class="pill"></span></div>` : ''}
    <p class="desc"></p>
    <div class="foot"><a class="go"></a><span class="path"></span></div>
  </article>`).join('');

grid.querySelectorAll('.card').forEach(card => {
  const p = PRODOTTI.find(x => x.id === card.dataset.id);
  const desc = card.querySelector('.desc'), go = card.querySelector('.go'), path = card.querySelector('.path'), seg = card.querySelector('.seg');
  const scegli = (i, anim) => {
    const m = p.modi[i];
    const metti = () => { desc.textContent = m.desc; desc.style.opacity = 1; };
    if (anim) { desc.style.opacity = 0; setTimeout(metti, 150); } else metti();
    go.innerHTML = m.btn + (m.href ? ARROW : '');
    if (m.href) { go.href = m.href; go.removeAttribute('aria-disabled'); path.textContent = '/' + decodeURIComponent(m.href); }
    else { go.removeAttribute('href'); go.setAttribute('aria-disabled', 'true'); path.textContent = ''; }
    if (seg) {
      const bs = seg.querySelectorAll('button'), pill = seg.querySelector('.pill');
      bs.forEach((b, j) => b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
      pill.style.width = `calc((100% - 8px) / ${bs.length})`; pill.style.transform = `translateX(${i * 100}%)`;
    }
    ricorda(p.id, String(i));
  };
  if (seg) seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) scegli(+b.dataset.i, true); });
  const salvato = +ricorda(p.id);
  scegli(Number.isInteger(salvato) && salvato < p.modi.length ? salvato : 0, false);
});
</script>
</body>
</html>
